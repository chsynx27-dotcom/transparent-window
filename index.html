<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>투명창</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root { --bg: #fff; --fg: #000; --code: #111; --line: #ccc; color-scheme: light; }
  /* 블랙 모드: 색만 바꾼다 */
  :root.dark { --bg: #0d0d0d; --fg: #f2f2f2; --code: #e6e6e6; --line: #333; color-scheme: dark; }
  body { margin: 0; font-family: sans-serif; background: var(--bg); color: var(--fg); }
  #screen { position: relative; z-index: 1; padding: 24px; padding-bottom: 80px; }
  #code {
    position: fixed; inset: 0 0 56px 0; margin: 0; padding: 24px;
    overflow: auto; font: 13px/1.5 monospace; white-space: pre-wrap;
    pointer-events: none; z-index: 0; color: var(--code);
    /* 투시 렌즈: 마우스 둘레는 코드가 또렷, 나머지는 단계 버튼 값만큼 */
    --x: -9999px; --y: -9999px; --base: 0.5; --r: 140px;
    -webkit-mask-image: radial-gradient(circle var(--r) at var(--x) var(--y), #000 60%, rgba(0,0,0,var(--base)) 100%);
            mask-image: radial-gradient(circle var(--r) at var(--x) var(--y), #000 60%, rgba(0,0,0,var(--base)) 100%); /* 버튼 */
  }
  #bar {
    position: fixed; left: 0; right: 0; bottom: 0; height: 56px;
    display: flex; align-items: center; gap: 12px; padding: 0 16px;
    border-top: 1px solid var(--line); background: var(--bg);
  }
  #dots { letter-spacing: 4px; font-size: 18px; }
  #dots i { font-style: normal; }
  #dots i::before { content: '○'; }
  #dots i.on::before { content: '●'; }
  #dots svg { display: none; }
  /* 3단계: 단계 칸이 동그란 칸이 되고, 칸마다 비밀 단어 힌트 아이콘 (자석 · 비 · 펑 · 지구 · 블랙홀) */
  :root.q3 #dots { display: inline-flex; gap: 6px; letter-spacing: 0; }
  :root.q3 #dots i::before { content: none; }
  :root.q3 #dots i { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%;
    border: 1.5px solid var(--accent); color: var(--accent); transition: background 0.2s, color 0.2s; }
  :root.q3 #dots i.on { background: var(--accent); color: #fff; }
  :root.q3 #dots svg { display: block; width: 13px; height: 13px; }
  /* 단계가 바뀔 때 코드 진하기가 점점 바뀌도록 */
  @property --base { syntax: '<number>'; inherits: true; initial-value: 0.5; }
  @property --r { syntax: '<length>'; inherits: true; initial-value: 140px; }
  #code { transition: --base 0.4s, --r 0.3s; }
  /* 첫 연출: 타자가 끝나면 꽉 찬 코드가 렌즈 크기로 줄어든다 */
  #code.shrink { transition: --base 1.4s ease-in-out, --r 1.4s ease-in-out; }
  #screen { transition: opacity 0.8s; }
  body.intro #screen { opacity: 0; }
  #screen > *, #screen li, #screen button { cursor: pointer; }
  #tools { display: flex; flex-wrap: wrap; gap: 8px; }
  /* 블랙/화이트 전환을 부드럽게: 화면 전체가 0.6초에 걸쳐 스르륵 바뀐다 */
  ::view-transition-old(root), ::view-transition-new(root) { animation-duration: 0.6s; animation-timing-function: ease; }
  /* 이스터에그: 코드 속 작은 '버튼' 글자만 누를 수 있다 */
  #screen { pointer-events: none; }
  #screen * { pointer-events: auto; }
  .egg { pointer-events: auto; cursor: pointer; font-size: 9px; }
  .egg:hover { background: #ffe14d; color: #111; }
  /* 퀄리티 업 1단계 '정돈': 글꼴 체계·여백·같은 크기의 버튼 */
  :root.q1 { --muted: #6b7280; }
  :root.q1.dark { --muted: #9ca3af; }
  :root.q1 body { font-family: Pretendard, system-ui, "Malgun Gothic", sans-serif; -webkit-font-smoothing: antialiased; }
  :root.q1 #screen { padding: 56px 56px 120px; }
  :root.q1 h1 { font-size: 56px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.05; margin: 0 0 14px; }
  :root.q1 #screen p { font-size: 18px; line-height: 1.6; color: var(--muted); max-width: 46ch; margin: 0 0 28px; }
  :root.q1 button, :root.q1 #memo { height: 38px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--fg); font-family: inherit; font-size: 14px; font-weight: 500; }
  :root.q1 #memo { width: 340px; height: 44px; margin-top: 20px; font-size: 15px; }
  :root.q1 #screen ul { margin: 24px 0 0; padding-left: 20px; color: var(--muted); line-height: 1.9; }
  :root.q1 #bar { padding: 0 24px; gap: 12px; font-size: 14px; }
  :root.q1 #code { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; }

  /* 2단계 '디자인': 편집기처럼 색 구분된 코드·줄 번호, 떠 있는 조절 막대, 포인트 색 하나 */
  :root.q2 { --accent: #4f46e5; --code: #24292f; --t-c: #6e7781; --t-s: #0a3069; --t-t: #116329; --t-k: #cf222e; --t-n: #0550ae; }
  :root.q2.dark { --accent: #8b87ff; --code: #c9d1d9; --t-c: #8b949e; --t-s: #a5d6ff; --t-t: #7ee787; --t-k: #ff7b72; --t-n: #79c0ff; }
  :root.q2 .t-c { color: var(--t-c); font-style: italic; }
  :root.q2 .t-s { color: var(--t-s); }
  :root.q2 .t-t { color: var(--t-t); }
  :root.q2 .t-k { color: var(--t-k); }
  :root.q2 .t-n { color: var(--t-n); }
  #code { counter-reset: ln; }
  :root.q2 #code > .ln::before { counter-increment: ln; content: counter(ln); display: inline-block; width: 3ch;
    margin-right: 2.5ch; text-align: right; color: var(--t-c); opacity: 0.6; }
  :root.q2 #code { inset: 0; }
  :root.q2 #quality { background: var(--accent); border-color: var(--accent); color: #fff; }
  :root.q2 button { transition: border-color 0.15s, transform 0.15s; }
  :root.q2 button:hover { border-color: var(--accent); }
  :root.q2 button:active { transform: scale(0.97); }
  :root.q2 #memo:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
  :root.q2 #bar { left: 50%; right: auto; bottom: 20px; transform: translateX(-50%); height: 52px;
    border: 1px solid var(--line); border-radius: 999px; box-shadow: 0 8px 30px rgba(0,0,0,0.12); }
  :root.q2 #bar button, :root.q2 #corner button { border-radius: 999px; }
  :root.q2 #dots { color: var(--accent); }
  :root.q2 .hit { background: color-mix(in srgb, var(--accent) 22%, transparent); color: inherit; box-shadow: inset 3px 0 var(--accent); }

  /* 3단계 '완성': 앞 화면이 진짜 창(제목 표시줄이 있는 유리 패널), 렌즈 테두리 */
  :root.q3 #screen { width: min(820px, calc(100% - 32px)); box-sizing: border-box; margin: 72px auto 0; padding: 80px 48px 44px;
    border-radius: 18px; border: 1px solid color-mix(in srgb, var(--fg) 12%, transparent);
    /* 유리 짙기 = 아래 투명/불투명 단계와 연동 (--glass: 0 투명 … 1 불투명) */
    background: linear-gradient(var(--line), var(--line)) 0 48px / 100% 1px no-repeat,
      color-mix(in srgb, var(--bg) calc(var(--glass, 0.5) * 92%), transparent);
    backdrop-filter: blur(calc(var(--glass, 0.5) * 3px)); -webkit-backdrop-filter: blur(calc(var(--glass, 0.5) * 3px));
    transition: background-color 0.4s;
    box-shadow: 0 30px 80px -20px rgba(0,0,0,0.28); }
  :root.q3 #screen::after { content: 'index.html'; position: absolute; top: 15px; left: 0; right: 0; text-align: center;
    font-size: 12px; color: var(--muted); }
  :root.q3 h1 { font-size: 64px; }
  :root.q3 #bar { background: color-mix(in srgb, var(--bg) 70%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  #ring { position: fixed; left: var(--x); top: var(--y); width: calc(var(--r) * 1.2); aspect-ratio: 1;
    transform: translate(-50%, -50%); border-radius: 50%; pointer-events: none; display: none;
    border: 1.5px solid color-mix(in srgb, var(--accent, #888) 70%, transparent);
    box-shadow: 0 0 24px color-mix(in srgb, var(--accent, #888) 45%, transparent); }
  :root.q3 #ring { display: block; }
  /* 단계가 오를 때 요소들이 차례로 떠오른다 */
  .rise { animation: rise 0.6s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  /* 화면이 깨지는 순간: 전체가 한 번 크게 흔들린다 */
  :root.broken, :root.flying { overflow: hidden; }
  :root.broken #screen { animation: quake 0.4s; }
  #screen.jolt { animation: jolt 0.55s linear; }   /* 3단계 펑: 날아가기 전에 덜덜 떤다 */
  @keyframes jolt { 0%, 100% { transform: none; } 10% { transform: translate(-3px, 2px) rotate(-0.4deg); }
    20% { transform: translate(4px, -2px) rotate(0.5deg); } 30% { transform: translate(-5px, -3px) rotate(-0.6deg); }
    40% { transform: translate(5px, 3px) rotate(0.6deg); } 50% { transform: translate(-7px, 2px) rotate(-0.8deg); }
    60% { transform: translate(7px, -4px) rotate(0.9deg); } 70% { transform: translate(-8px, 4px) rotate(-1deg); }
    80% { transform: translate(9px, -3px) rotate(1.1deg); } 90% { transform: translate(-10px, 3px) rotate(-1.2deg); } }
  /* 펑: 부풀며 번지다 사라짐 / 되돌아올 때: 작게 모였다 나타남 */
  .pop { animation: pop 0.45s ease-out both; }
  @keyframes pop { 40% { transform: scale(1.25); filter: blur(1px); opacity: 1; }
    100% { transform: scale(1.8); filter: blur(10px); opacity: 0; } }
  /* 코드 비 (0~2단계): 줄이 한 줄씩 떨어졌다가 되감기듯 올라온다. 1단계만 곧게, 0·2단계는 제멋대로 기울며 */
  #code.scatter > .ln { display: block; width: fit-content; }   /* 펑 0·1단계: 줄을 따로 (글자 길이만큼) 움직이려고 */
  #code.rain > .ln, #code.unrain > .ln { display: block; }
  /* 화면에 보이는 줄(.f)만 떨어뜨린다 — 화면 밖 1,000여 줄까지 움직이면 프레임이 크게 떨어진다 */
  #code.rain > .ln.f { animation: drop 1.4s cubic-bezier(.5,0,.9,.5) var(--d) both; }
  #code.unrain > .ln.f { animation: drop 1s cubic-bezier(.1,.5,.5,1) var(--d) both reverse; }
  #code.rq2c .u { visibility: hidden; }   /* 2단계 비: 글자는 캔버스가 대신 그린다 */
  @keyframes drop { to { transform: translateY(110vh) rotate(var(--rot)); opacity: 0.15; } }
  /* 1·2단계: 0단계처럼 그냥 떨어지되 빗줄기답게 — 떨어지는 단위가 작아진다(0 줄 → 1 단어 → 2 글자), 속도는 제각각, 위로 꼬리 */
  #code.rain.rq1 > .ln, #code.rain.rq2 > .ln, #code.unrain.rq1 > .ln, #code.unrain.rq2 > .ln { animation: none; }
  #code.rain .u { display: inline-block; animation: fall var(--t) cubic-bezier(.55,0,1,.45) var(--d) both; }
  #code.unrain .u { display: inline-block; animation: fall 0.9s cubic-bezier(0,.55,.45,1) var(--d) both reverse; }
  @keyframes fall { to { transform: translateY(110vh); opacity: 0.3; } }
  #code.rq1 > .ln { text-shadow: 0 -7px color-mix(in srgb, currentColor 28%, transparent), 0 -15px color-mix(in srgb, currentColor 12%, transparent); }
  #code.rq2 > .ln { text-shadow: 0 -6px color-mix(in srgb, currentColor 45%, transparent),   /* 2단계: 코드 색 그대로 더 긴 꼬리 */
      0 -13px color-mix(in srgb, currentColor 25%, transparent), 0 -21px color-mix(in srgb, currentColor 12%, transparent); }
  /* 코드 비 (3단계): 코드가 먼저 흑백으로 바래고, 글자는 제자리에 둔 채 파란 빗줄기가 글자 속으로만 흘러내린다 */
  #code.gray, #code.gray * { transition: color 0.6s; }
  #code.gray, #code.gray *, #code.gray > .ln::before { color: var(--gray) !important; }
  #code { --gray: #9aa0a6; }
  :root.dark #code { --gray: #5c6066; }
  #code.blue, #code.blue *, #code.blue > .ln::before { color: transparent !important; }
  #code.blue {
    -webkit-background-clip: text; background-clip: text;
    background-image:                   /* 빗방울 머리는 진하게, 꼬리는 위로 옅어짐 */
      radial-gradient(5px 90px at 50% 80%, #2563eb 25%, rgba(37,99,235,0.5) 55%, transparent 70%),
      radial-gradient(6px 120px at 50% 80%, #3b82f6 25%, rgba(59,130,246,0.45) 55%, transparent 70%),
      radial-gradient(4px 70px at 50% 80%, #1d4ed8 25%, rgba(29,78,216,0.5) 55%, transparent 70%),
      linear-gradient(var(--gray), var(--gray));
    background-size: 31px 190px, 53px 260px, 19px 150px, 100% 100%;
    animation: rainfall 1.1s linear infinite; }
  :root.dark #code.blue { background-image:
      radial-gradient(5px 90px at 50% 80%, #60a5fa 25%, rgba(96,165,250,0.5) 55%, transparent 70%),
      radial-gradient(6px 120px at 50% 80%, #93c5fd 25%, rgba(147,197,253,0.45) 55%, transparent 70%),
      radial-gradient(4px 70px at 50% 80%, #3b82f6 25%, rgba(59,130,246,0.5) 55%, transparent 70%),
      linear-gradient(var(--gray), var(--gray)); }
  @keyframes rainfall { from { background-position: 0 0, 14px 60px, 7px 100px, 0 0; }
    to { background-position: 0 190px, 14px 320px, 7px 250px, 0 0; } }
  /* 펑 (3단계): 코드는 제자리, 글자 속으로 검은 속·빨간 테두리가 터져 번졌다가 원래 색으로 */
  @property --br { syntax: '<length>'; inherits: false; initial-value: 0px; }
  @property --core { syntax: '<color>'; inherits: false; initial-value: #111; }
  @property --ring { syntax: '<color>'; inherits: false; initial-value: #d4140f; }
  #code.burn, #code.burn *, #code.burn > .ln::before { color: transparent !important; }
  #code.burn { -webkit-background-clip: text; background-clip: text;
    background-image: radial-gradient(circle at var(--bx) var(--by), var(--core) calc(var(--br) * 0.5),
      var(--ring) calc(var(--br) * 0.8), #ff6a1a calc(var(--br) * 0.93), var(--code) var(--br));
    animation: burn 2.6s cubic-bezier(.3,.6,.45,1) both; }
  :root.dark #code.burn { animation-name: burn-dark; }
  @keyframes burn { 0% { --br: 0px; --core: #111; --ring: #d4140f; }
    60% { --br: 120vmax; --core: #111; --ring: #d4140f; } 100% { --br: 120vmax; --core: var(--code); --ring: var(--code); } }
  @keyframes burn-dark { 0% { --br: 0px; --core: #4a0606; --ring: #ff2a1a; }
    60% { --br: 120vmax; --core: #4a0606; --ring: #ff2a1a; } 100% { --br: 120vmax; --core: var(--code); --ring: var(--code); } }
  /* 블랙홀 3단계: 검은 구멍 + 얇게 빛나는 고리 + 따뜻한 빛무리 (코드 단어들이 그 둘레 원반이 된다) */
  #hole { position: fixed; z-index: 5; border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%) scale(0);
    background: radial-gradient(circle, #000 0 60%, #fff6e4 63%, rgba(255,196,130,.55) 67%, transparent 74%);
    box-shadow: 0 0 80px 30px rgba(255,170,90,.22); }
  #flock.garg span { text-shadow: 0 0 6px rgba(255,170,90,.8); }
  /* 지구: 코드 글자로 그린 도는 지구. 단계가 오를수록 색·명암·매끄러움이 더해진다 */
  #globe { position: fixed; inset: 0; margin: 0; z-index: 1; pointer-events: none; overflow: hidden;
    font: 13px/1.5 ui-monospace, "Cascadia Code", Consolas, monospace; white-space: pre; font-variant-ligatures: none;
    color: #b0b4ba; opacity: 0; transform: scale(0.94); transition: opacity 0.6s, transform 0.8s cubic-bezier(.2,.8,.3,1); }
  #globe i { font-style: normal; }
  :is(#globe, #flock) .g { color: #5f6368; font-weight: 700; }
  :root.dark #globe { color: #5f6368; }
  :root.dark :is(#globe, #flock) .g { color: #c4c7cc; }
  :is(#globe, #flock) .s { color: color-mix(in srgb, #2f6fd0 45%, transparent); }
  :is(#globe, #flock) .l { color: #1f8a43; font-weight: 700; }
  :root.dark :is(#globe, #flock) .s { color: color-mix(in srgb, #5b8def 60%, transparent); }
  :root.dark :is(#globe, #flock) .l { color: #57d17a; }
  :is(#globe, #flock) .l0 { color: #8be29c; font-weight: 700; } :is(#globe, #flock) .l1 { color: #3fb860; font-weight: 700; }
  :is(#globe, #flock) .l2 { color: #1f8a43; font-weight: 700; } :is(#globe, #flock) .l3 { color: #134f2a; font-weight: 700; }
  :is(#globe, #flock) .s0 { color: #9fd0ff; } :is(#globe, #flock) .s1 { color: #4f9df5; } :is(#globe, #flock) .s2 { color: #2f6fd0; } :is(#globe, #flock) .s3 { color: #1c3f7a; }
  :is(#globe, #flock) .ic { color: #e9f3ff; font-weight: 700; text-shadow: 0 0 2px #7fb2ff; }
  :root.earth-on #globe { opacity: 1; transform: none; }
  /* 지구가 되기 전: 코드 글자가 하나하나 떨어져 나와 지구 원 모양 자리로 모인다 */
  :root.earth #code { opacity: 0; }
  #flock { position: fixed; inset: 0; z-index: 1; pointer-events: none; transition: opacity 0.4s;
    font: 13px/1.5 ui-monospace, "Cascadia Code", Consolas, monospace; color: var(--code); }
  :root:not(.q1) #flock { font-family: monospace; }   /* 0단계: 뒤 코드와 같은 글꼴 (다르면 글자 폭이 달라 단어끼리 겹친다) */
  #flock span { position: absolute; transition: color 1.4s, font-weight 1.4s; }   /* 날아가는 동안 도착할 칸의 지구 색으로 물든다 */
  #flock .w { color: #b0b4ba; }
  :root.dark #flock .w { color: #5f6368; }
  :root.earth #screen { opacity: 0.2; }
  .unpop { animation: unpop 0.6s cubic-bezier(.2,.8,.3,1) both; }
  @keyframes unpop { from { transform: scale(0.6); filter: blur(6px); opacity: 0; } }
  @keyframes quake { 20% { transform: translate(-12px, 6px); } 40% { transform: translate(10px, -8px); }
    60% { transform: translate(-6px, -4px); } 80% { transform: translate(4px, 6px); } }
  #corner { position: fixed; top: 16px; right: 24px; z-index: 2; display: flex; gap: 6px; }
  #dark { min-width: 7.5em; text-align: center; }
  #corner [aria-pressed="true"] { font-weight: bold; background: #ffe14d; color: #111; }
  #memo { margin-top: 16px; font-size: 16px; padding: 6px; }
  .hit { background: #ffe14d; color: #111; transition: background 0.3s; }
  /* 이스터에그 달걀 6개 (오른쪽 아래): 하나 찾을 때마다 하나씩 깨진다. 단계가 오를수록 달걀도, 깨지는 모습도 좋아진다 */
  #eggs { position: fixed; right: 14px; bottom: 64px; z-index: 3; display: flex; align-items: flex-end; gap: 5px; pointer-events: none; }
  #eggs i { display: inline-block; }
  /* 0단계: 글자 달걀 [] — 깨지면 [ */
  #eggs b { font: 15px/1 monospace; color: color-mix(in srgb, var(--fg) 55%, transparent); }
  #eggs b::before { content: '[]'; } #eggs .cracked b::before { content: '['; }
  #eggs svg { display: none; width: 12px; height: 16px; overflow: visible; }
  :root.q1 #eggs b { display: none; } :root.q1 #eggs svg { display: block; }
  #eggs .shell { fill: none; stroke: color-mix(in srgb, var(--fg) 60%, transparent); stroke-width: 1.6; }
  #eggs .shine, #eggs .yolk, #eggs .crack { display: none; }
  #eggs .a { clip-path: url(#egg-left); } #eggs .b { clip-path: url(#egg-right); }   /* 1단계: 세로로 반 가른다 */
  #eggs .cracked .b { display: none; }
  #eggs .a, #eggs .b { transform-box: fill-box; transform-origin: 50% 100%; }
  /* 1단계: 테두리 달걀, 반쪽이 옆으로 기울며 미끄러져 사라진다 */
  :root.q1 #eggs .cracking .b { animation: egg-slide 0.5s ease-in forwards; }
  @keyframes egg-slide { to { transform: translate(7px, 2px) rotate(25deg); opacity: 0; } }
  /* 2단계: 명암 있는 달걀, 흔들리다 지그재그로 금 가며 윗부분이 튕겨 나간다 */
  :root.q2 #eggs { right: 22px; bottom: 28px; gap: 4px; }
  :root.q2 #eggs svg { width: 12px; height: 16px; }
  :root.q2 #eggs .shell { fill: url(#egg-fill); stroke: color-mix(in srgb, var(--fg) 25%, transparent); stroke-width: 0.8; }
  :root.q2 #eggs .a { clip-path: url(#egg-bottom); } :root.q2 #eggs .b { clip-path: url(#egg-top); }
  :root.q2 #eggs .cracked .crack { display: inline; fill: none; stroke: color-mix(in srgb, var(--fg) 45%, transparent); stroke-width: 0.8; }
  :root.q2 #eggs .cracking { animation: egg-wobble 0.35s ease-in-out; }
  :root.q2 #eggs .cracking .b { animation: egg-pop 0.6s cubic-bezier(.3,.6,.6,1) 0.35s forwards; }
  @keyframes egg-wobble { 25% { transform: rotate(-12deg); } 75% { transform: rotate(12deg); } }
  @keyframes egg-pop { 40% { transform: translate(3px, -9px) rotate(20deg); opacity: 1; } to { transform: translate(8px, -4px) rotate(70deg); opacity: 0; } }
  /* 3단계: 광택 달걀 + 그림자, 흔들림 → 윗껍질이 날아가고 안에서 노른자 빛 */
  :root.q3 #eggs svg { width: 13px; height: 17px; filter: drop-shadow(0 1px 1.5px rgba(0,0,0,.25)); }
  :root.q3 #eggs .shell { fill: url(#egg-gloss); stroke: none; }
  :root.q3 #eggs .shine { display: inline; fill: #fff; opacity: .7; }
  :root.q3 #eggs .cracked .yolk { display: inline; fill: url(#egg-yolk); }
  :root.q3 #eggs .cracked { filter: drop-shadow(0 0 5px rgba(255,190,60,.55)) drop-shadow(0 2px 3px rgba(0,0,0,.25)); }
  :root.q3 #eggs .cracking { animation: egg-wobble 0.45s ease-in-out, egg-glow 1.4s ease-out 0.45s; }
  :root.q3 #eggs .cracking .b { animation: egg-fly 0.8s cubic-bezier(.2,.7,.4,1) 0.45s forwards; }
  :root.q3 #eggs .cracking .yolk { animation: egg-yolk 0.6s ease-out 0.45s both; transform-box: fill-box; transform-origin: center; }
  @keyframes egg-fly { 30% { transform: translate(4px, -16px) rotate(35deg); opacity: 1; } to { transform: translate(14px, -10px) rotate(160deg); opacity: 0; } }
  @keyframes egg-glow { 0% { filter: drop-shadow(0 0 0 rgba(255,190,60,0)); } 25% { filter: drop-shadow(0 0 12px rgba(255,200,80,.95)); } }
  @keyframes egg-yolk { from { transform: scale(0.3); opacity: 0; } }
</style>
</head>
<body class="intro">
<div id="corner">
  <button type="button" id="en">EN</button>
  <button type="button" id="hj">漢字</button>
  <button type="button" id="dark">블랙 모드</button>
</div>
<div id="eggs" aria-hidden="true"></div>
<main id="screen">
  <h1>투명창</h1>
  <p>이 페이지는 자기 자신의 코드를 겹쳐 보여줍니다. (더미 내용)</p>
  <div id="tools">
    <button type="button" id="shake">코드 뒤섞기 (막 눌러 보세요)</button>
    <button type="button" id="bigger">렌즈 크게</button>
    <button type="button" id="smaller">렌즈 작게</button>
    <button type="button" id="retype">타자 다시 보기</button>
    <button type="button" id="quality">퀄리티 업 · 기본 0/3</button>
  </div>
  <input id="memo" type="text" placeholder="여기에 글자를 적어 보세요" size="30">
  <ul>
    <li>목록 하나</li>
    <li>목록 둘</li>
  </ul>
</main>

<pre id="code" aria-hidden="true"></pre>
<pre id="globe" aria-hidden="true"></pre>

<div id="bar">
  <span>창</span>
  <button type="button" id="down">◀ 불투명</button>
  <span id="dots" aria-live="polite"></span>
  <button type="button" id="up">투명 ▶</button>
</div>

<script>
  const screenEl = document.getElementById('screen');
  const codeEl = document.getElementById('code');
  const dots = document.getElementById('dots');

  // 화면 글자는 항상 진하게(앞). 좌우 버튼으로 뒤에 깔린 코드의 진하기를 5단계로 바꾼다.
  // 단계 칸 아이콘 (3단계에서만 보임): 비밀 단어 힌트 — 자석 · 물방울(비) · 터짐(펑) · 지구 · 소용돌이(블랙홀)
  const HINTS = [
    '<svg viewBox="0 0 24 24"><path d="M5 3h5v9a2 2 0 0 0 4 0V3h5v9a7 7 0 0 1-14 0z" fill="currentColor"/><path d="M5 7h5M14 7h5" stroke="var(--bg)" stroke-width="1.5"/></svg>',
    '<svg viewBox="0 0 24 24"><path d="M12 3c3 4.5 6 7.8 6 11a6 6 0 0 1-12 0c0-3.2 3-6.5 6-11z" fill="currentColor"/></svg>',
    '<svg viewBox="0 0 24 24"><path d="M12 2l2.2 6.1 6-2.6-3.1 5.8 5.4 3.2-6.4.8.6 6.5-4.7-4.5-4.7 4.5.6-6.5-6.4-.8 5.4-3.2L3.8 5.5l6 2.6z" fill="currentColor"/></svg>',
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.8 3 2.8 15 0 18M12 3c-2.8 3-2.8 15 0 18"/></svg>',
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 12a1.5 1.5 0 1 1 1.5-1.5 4 4 0 1 1-4-4 6.5 6.5 0 1 1-6.5 6.5"/></svg>'];
  let level = 2;                        // 0 = 코드 안 보임 … 4 = 코드 또렷
  let shaking = false;                  // 뒤섞는 동안은 코드를 다 보이게
  let typing = false;                   // 타자 치는 동안도 코드를 다 보이게
  let raining = false;                  // 비가 내리는 동안도 코드를 다 보이게
  function apply() {
    codeEl.style.setProperty('--base', shaking || typing || raining ? 1 : level / 4);
    document.documentElement.style.setProperty('--glass', shaking || typing ? 0 : 1 - level / 4);
    const shown = typing ? 4 : level;  // 타자 중에는 끝까지 투명(코드 다 보임)으로 표시
    dots.innerHTML = HINTS.map((h, i) => `<i${i <= shown ? ' class="on"' : ''}>${h}</i>`).join('');   // 지금 단계 표시
    dots.setAttribute('aria-label', `창 투명도 ${shown + 1}/5단계`);
  }
  document.getElementById('down').addEventListener('click', () => { level = Math.max(0, level - 1); apply(); });
  document.getElementById('up').addEventListener('click', () => { level = Math.min(4, level + 1); apply(); });
  apply();

  // 투시 렌즈: 마우스(손가락)가 있는 곳만 뒤의 코드가 비쳐 보인다
  let lastX = innerWidth / 2, lastY = innerHeight / 2;   // 마지막 마우스 위치 (없으면 화면 가운데)
  addEventListener('pointermove', e => { lastX = e.clientX; lastY = e.clientY; });
  function lens(x, y) {
    codeEl.style.setProperty('--x', x + 'px');
    codeEl.style.setProperty('--y', y + 'px');
  }
  let holdLens = 0;                     // 짝 찾기 직후 렌즈를 잠깐 고정
  addEventListener('pointermove', e => { if (Date.now() > holdLens) lens(e.clientX, e.clientY); });
  document.documentElement.addEventListener('pointerleave', () => lens(-9999, -9999));

  // 코드를 줄 단위로 넣는다 (짝 찾기에서 줄을 집어내려고)
  let lines = [];
  let orig = [];                        // 지금 보여 줄 줄 (뒤섞여도 이걸로 되돌린다)
  let pristine = [];                    // 처음 받은 그대로 (한글 원본)
  function showCode(src) {
    codeEl.textContent = '';
    codeEl.append(ring);
    orig = src.split('\n');
    pristine = orig.slice();
    memoIdx = orig.findIndex(t => t.trim().startsWith('<input id="memo"'));
    memoBase = memoIdx >= 0 ? orig[memoIdx] : '';
    lines = orig.map(text => {
      const span = document.createElement('span');
      span.className = 'ln';
      codeEl.appendChild(span);
      return span;
    });
    eggIdx = orig.findIndex(t => t.includes('/* 버튼 */'));
    typeOut();
  }

  // 코드 색 구분: 주석·문자열·태그·예약어·숫자를 조각내 표시 (색은 2단계부터 보인다)
  const TOK = /(\/\/.*$|\/\*.*?\*\/|<!--.*?-->)|('(?:[^'\\]|\\.)*'|"(?:[^"\\]|\\.)*"|`(?:[^`\\]|\\.)*`)|(<\/?[a-zA-Z][\w-]*|\/?>)|\b(const|let|function|return|if|else|for|new|true|false|null|of|in)\b|(#[0-9a-fA-F]{3,6}\b|\b\d+(?:\.\d+)?(?:px|s|%|deg|vw|vh|em|ch)?)/g;
  const KIND = ['c', 's', 't', 'k', 'n'];
  function paint(text) {
    const frag = document.createDocumentFragment();
    let last = 0;
    for (const m of text.matchAll(TOK)) {
      frag.append(text.slice(last, m.index));
      const span = document.createElement('span');
      span.className = 't-' + KIND[m.slice(1).findIndex(g => g !== undefined)];
      span.textContent = m[0];
      frag.append(span);
      last = m.index + m[0].length;
    }
    frag.append(text.slice(last));
    return frag;
  }

  // 코드 줄 하나를 원본대로 쓴다. 이스터에그 줄이면 '버튼' 글자만 누를 수 있게 꾸민다
  let eggIdx = -1;
  function setLine(i) {
    const line = lines[i], text = orig[i];
    if (i !== eggIdx) { line.textContent = ''; line.append(paint(text), '\n'); return; }
    const word = EGG[lang], at = text.lastIndexOf(word);
    if (at < 0) { line.textContent = text + '\n'; return; }
    line.textContent = '';
    const egg = document.createElement('span');
    egg.className = 'egg'; egg.textContent = word;
    egg.addEventListener('click', hatch);
    line.append(text.slice(0, at), egg, text.slice(at + word.length) + '\n');
  }

  // 이스터에그 달걀 6개: 코드 속 '버튼' + 비밀 단어 5개. 처음 찾을 때마다 왼쪽 달걀부터 하나씩 깨진다
  const EGG_PATH = 'M12 1C6 1 1.5 10 1.5 18.5 1.5 25.5 6 31 12 31s10.5-5.5 10.5-12.5C22.5 10 18 1 12 1z';
  const ZIG = '0,16 4,13 8,17 12,13 16,17 20,13 24,16';    // 2단계부터 금 가는 선
  const eggsEl = document.getElementById('eggs'), foundEggs = new Set();
  eggsEl.innerHTML = `<svg width="0" height="0" style="position:absolute"><defs>
      <clipPath id="egg-shape"><path d="${EGG_PATH}"/></clipPath>
      <clipPath id="egg-left"><rect x="-4" y="-4" width="16" height="40"/></clipPath>
      <clipPath id="egg-right"><rect x="12" y="-4" width="16" height="40"/></clipPath>
      <clipPath id="egg-top"><polygon points="-4,-4 28,-4 28,16 ${ZIG.split(' ').reverse().join(' ')}"/></clipPath>
      <clipPath id="egg-bottom"><polygon points="${ZIG} 28,40 -4,40"/></clipPath>
      <linearGradient id="egg-fill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffaf0"/><stop offset="1" stop-color="#e3d5bd"/></linearGradient>
      <radialGradient id="egg-gloss" cx=".38" cy=".3" r=".8"><stop offset="0" stop-color="#fff"/><stop offset=".45" stop-color="#f4e8d4"/><stop offset="1" stop-color="#c9b08a"/></radialGradient>
      <radialGradient id="egg-yolk" cx=".45" cy=".4"><stop offset="0" stop-color="#ffe680"/><stop offset="1" stop-color="#f29a1f"/></radialGradient>
    </defs></svg>` + Array.from({ length: 6 }, () => `<i><b></b><svg viewBox="0 0 24 32">
      <g class="a"><path class="shell" d="${EGG_PATH}"/><ellipse class="yolk" cx="12" cy="19.5" rx="7" ry="3.4"/><ellipse class="shine" cx="8" cy="10" rx="2" ry="3.6" transform="rotate(-20 8 10)"/></g>
      <g class="b"><path class="shell" d="${EGG_PATH}"/><ellipse class="shine" cx="8" cy="10" rx="2" ry="3.6" transform="rotate(-20 8 10)"/></g>
      <polyline class="crack" points="${ZIG}" clip-path="url(#egg-shape)"/></svg></i>`).join('');
  const CRACK_MS = [0, 500, 950, 1250];  // 단계별 깨지는 시간 (0단계는 바로 [ 가 된다)
  function foundEgg(id) {
    if (foundEggs.has(id)) return;      // 같은 이스터에그는 한 번만
    foundEggs.add(id);
    const egg = eggsEl.querySelectorAll('i')[foundEggs.size - 1];
    if (!egg) return;
    egg.classList.add('cracking');
    setTimeout(() => { egg.classList.remove('cracking'); egg.classList.add('cracked'); }, CRACK_MS[quality]);
  }

  // 이스터에그: 코드 속 '버튼'을 누르면 글상자에 살짝 적힌다
  function hatch(e) {
    e.stopPropagation();
    foundEgg('button');
    memo.value = EGG_TEXT[lang];
    memo.dispatchEvent(new Event('input'));   // 뒤 코드에도 그대로 써진다
  }

  // 타자 효과: 코드가 누가 치는 것처럼 한 글자씩 쓰여 나간다
  const SPEED = 30;                     // 한 프레임(약 1/60초)에 치는 글자 수
  const TYPE_LIMIT = 2200;              // 이만큼(ms) 치다가 나머지는 한 번에 채우고 넘어간다
  let typeFrame = null;
  function typeOut() {
    cancelAnimationFrame(typeFrame);
    lines.forEach(s => { s.textContent = ''; });
    codeEl.scrollTop = 0;
    typing = true; apply();
    // 불투명으로 시작: 앞 화면은 숨기고, 렌즈를 화면 전체 크기로 키운다
    document.body.classList.add('intro');
    codeEl.classList.remove('shrink');
    codeEl.style.setProperty('--r', Math.hypot(innerWidth, innerHeight) + 'px');
    lens(innerWidth / 2, innerHeight / 2);
    holdLens = Infinity;
    let li = 0, pos = 0;
    const typeStart = performance.now();
    function step() {
      let budget = SPEED;
      while (budget > 0 && li < lines.length) {
        const text = orig[li];
        const take = Math.min(budget, text.length - pos);
        pos += take; budget -= take;
        if (pos >= text.length) {       // 이 줄 끝 → 다음 줄
          setLine(li);
          li++; pos = 0; budget--;
        } else {
          lines[li].textContent = text.slice(0, pos) + '▌\n';
        }
      }
      // 치고 있는 줄이 화면 아래로 내려가면 따라 내려간다
      const cur = lines[Math.min(li, lines.length - 1)];
      if (cur.offsetTop > codeEl.scrollTop + codeEl.clientHeight * 0.7)
        codeEl.scrollTop = cur.offsetTop - codeEl.clientHeight * 0.7;
      if (li < lines.length && performance.now() - typeStart < TYPE_LIMIT) typeFrame = requestAnimationFrame(step);
      else finishTyping();
    }
    typeFrame = requestAnimationFrame(step);
  }
  function finishTyping() {             // 다 쳤거나, 중간에 다른 기능을 누르면 바로 끝낸다
    if (!typing) return;
    cancelAnimationFrame(typeFrame);
    lines.forEach((s, i) => setLine(i));
    codeEl.scrollTo({ top: 0, behavior: 'smooth' });
    // 꽉 찬 코드가 마우스 자리의 렌즈로 쪼그라들고, 앞 화면이 떠오른다
    codeEl.classList.add('shrink');
    lens(lastX, lastY);
    codeEl.style.setProperty('--r', radius + 'px');
    typing = false; apply();
    document.body.classList.remove('intro');
    holdLens = Date.now() + 1400;
    setTimeout(() => codeEl.classList.remove('shrink'), 1400);
  }
  // 타자 중에 아무 데나 누르면 건너뛴다
  addEventListener('click', () => { if (typing) finishTyping(); }, true);
  document.getElementById('retype').addEventListener('click', e => { e.stopPropagation(); typeOut(); });

  // 짝 찾기: 화면 요소를 누르면 그 요소를 만든 코드 줄이 반짝인다
  const firstLine = new WeakMap();      // 처음(한글) 모양의 첫 줄을 기억
  screenEl.querySelectorAll('*').forEach(el => firstLine.set(el, el.outerHTML.split('\n')[0].trim()));
  screenEl.addEventListener('click', e => {
    if (e.target.id === 'shake') return;  // 뒤섞기는 짝 찾기 대신 뒤섞기만
    finishTyping();
    const el = e.target.closest('#screen button, #screen li, #screen > *');
    if (!el) return;
    const first = firstLine.get(el) || el.outerHTML.split('\n')[0].trim();
    // 화면(main) 부분의 줄에서만 찾는다 — 스크립트 속 같은 글자는 제외
    const start = pristine.findIndex(t => t.includes('<main id="screen">'));
    const end = pristine.findIndex((t, i) => i > start && t.includes('</main>'));
    const idx = pristine.findIndex((t, i) => i > start && i < end && t.trim().startsWith(first));
    const found = el.id === 'memo' ? memoIdx : idx;   // 입력칸 줄은 글자가 들어가 모양이 바뀌므로 따로 기억
    if (found < 0) return;
    flash(found);
  });

  // 코드 줄 하나를 반짝이고 렌즈를 그 줄로 옮긴다
  let flashTimer = null;
  function flash(i) {
    const line = lines[i];
    lines.forEach(s => s.classList.remove('hit'));
    line.classList.add('hit');
    line.scrollIntoView({ block: 'center' });
    const r = line.getBoundingClientRect();
    lens(r.left + 120, r.top + r.height / 2);
    holdLens = Date.now() + 1500;
    clearTimeout(flashTimer);
    flashTimer = setTimeout(() => line.classList.remove('hit'), 1500);
  }

  // 앞에서 글자를 적으면 뒤의 코드(입력칸 줄)에 그대로 써진다
  let memoIdx = -1;
  const memo = document.getElementById('memo');
  memo.addEventListener('input', () => {
    if (memoIdx < 0) return;
    finishTyping();
    writeMemoLine();
    flash(memoIdx);
    clearTimeout(secretTimer);
    if (!findSecret()) lastSecret = '';   // 비밀 단어를 지우면 다음에 다시 반응
    secretTimer = setTimeout(checkSecret, 500);
  });
  // 비밀 단어: 글상자 끝에 이 말이 있으면 반응한다
  const SECRETS = [
    { words: ['펑', '폭발', 'boom', '爆'], run: () => boom() },
    { words: ['비', 'rain', '雨'], run: () => rain() },
    { words: ['지구', '행성', 'earth', 'planet', '地球', '行星'], run: () => earth() },
    { words: ['자석', 'magnet', '磁石'], run: () => magnet() },
    { words: ['블랙홀', '우주', 'blackhole', 'black hole', 'space', '黑洞', '宇宙'], run: () => blackhole() },
  ];
  let secretTimer = null, lastSecret = '';
  const findSecret = () => SECRETS.find(x => x.words.some(w => memo.value.trim().toLowerCase().endsWith(w)));
  function checkSecret() {
    const v = memo.value.trim().toLowerCase();
    const hit = findSecret();
    if (hit && v !== lastSecret) { hit.run(); foundEgg(hit.words[0]); }
    lastSecret = hit ? v : '';          // 같은 글 그대로면 다시 터지지 않게
  }
  function writeMemoLine() {
    const v = memo.value.replace(/&/g, '&amp;').replace(/"/g, '&quot;');
    orig[memoIdx] = memoBase.replace(/>$/, v ? ` value="${v}">` : '>');
    setLine(memoIdx);

  let memoBase = '';

  // 흩어지기 (펑 0·1단계): 화면에 보이는 코드가 0단계는 3~7줄 덩어리째, 1단계는 한 줄씩 가운데서 사방으로 흩어진다
  function scatter(level) {
    codeEl.classList.add('scatter');
    const seen = lines.filter(l => { const r = l.getBoundingClientRect(); return r.bottom > 0 && r.top < innerHeight; });
    const anims = [];
    for (let i = 0; i < seen.length;) {
      const group = seen.slice(i, i += level === 0 ? 3 + Math.floor(Math.random() * 5) : 1);
      const a = group[0].getBoundingClientRect(), b = group[group.length - 1].getBoundingClientRect();
      const gx = a.left + a.width / 2, gy = (a.top + b.bottom) / 2;   // 덩어리 가운데
      const ang = Math.random() * Math.PI * 2;        // 덩어리마다 제각각 여기저기로
      const far = 300 + Math.random() * 500, turn = (Math.random() - 0.5) * (level === 0 ? 70 : 30);
      const tx = Math.cos(ang) * far, ty = Math.sin(ang) * far;
      const delay = Math.random() * 120;
      group.forEach(l => {              // 덩어리 안 줄들은 함께, 덩어리 가운데를 축으로 돈다
        const r = l.getBoundingClientRect();
        l.style.transformOrigin = `${gx - r.left}px ${gy - r.top}px`;
        anims.push(l.animate([{ transform: 'none', opacity: 1 },
          { transform: `translate(${tx}px, ${ty}px) rotate(${turn}deg)`, opacity: 0 }],
          { duration: level === 0 ? 1100 : 950, delay, easing: 'cubic-bezier(.2,.7,.3,1)', fill: 'forwards' }));
      });
    }
    return () => {                      // 보이지 않는 사이 제자리에 두고 서서히 나타난다
      codeEl.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 800, easing: 'ease-in-out' });
      anims.forEach(a => a.cancel());
      seen.forEach(l => l.style.transformOrigin = '');
      codeEl.classList.remove('scatter');
    };
  }

  // 화면 글자 깨뜨리기: 절반을 넘기면 앞 화면 글자가 기호로 바뀌며 색이 갈라지다가, 최대치에서 펑 터진다
  const pieces = () => screenEl.querySelectorAll('h1, p, #tools button, #memo, li');
  const saved = new Map();              // 깨지기 전 글자 (되돌릴 때 쓴다)
  const textOf = el => el.id === 'memo' ? el.placeholder : el.textContent;
  const setText = (el, t) => { if (el.id === 'memo') el.placeholder = t; else el.textContent = t; };
  function distort() {
    const g = Math.max(0, (power - MAX / 2) / (MAX / 2));   // 0 … 1
    if (!g) return;
    const burst = power >= MAX;
    pieces().forEach(el => {
      if (!saved.has(el)) saved.set(el, textOf(el));
      const t = saved.get(el);
      setText(el, t.replace(/\S/g, c => Math.random() < g * 0.85 ? GLYPHS[Math.floor(Math.random() * GLYPHS.length)] : c));
      el.style.textShadow = `${3 * g}px 0 rgba(255,0,70,.75), ${-3 * g}px 0 rgba(0,220,255,.75)`;
      if (burst && !el.classList.contains('pop')) {
        el.style.animationDelay = (Math.random() * 0.15) + 's';
        el.classList.add('pop');
      }
    });
    if (burst) document.documentElement.classList.add('broken');
  }
  // 화산 분출 (2단계 펑): 코드가 단어 덩어리째 제자리에서 용암빛으로 솟구쳐 화면 위로 날아가 사라지고,
  // 다 날아가면 코드가 서서히 다시 나타난다
  // 화면에 보이는 뒤 코드를 단어 덩어리로 (화산·자석·블랙홀이 함께 쓴다 — 글자 하나하나보다 가볍다)
  function visibleWords() {
    const probe = document.createElement('span');
    probe.textContent = 'M'.repeat(10); probe.style.font = getComputedStyle(codeEl).font;
    document.body.append(probe);
    const cw = probe.getBoundingClientRect().width / 10; probe.remove();
    const words = [];                   // 붙어 있는 글자끼리 한 단어로
    for (const { c, x, y, w } of visibleChars(cw, 3000)) {
      const last = words[words.length - 1];
      if (last && last.y === y && Math.abs(last.end - x) < 1) { last.t += c; last.end = x + w; }
      else words.push({ t: c, x, y, end: x + w });
    }
    return words;
  }
  // 단어 덩어리를 코드 대신 띄운다 (진짜 코드는 그동안 숨김). 돌려주는 함수로 원래대로
  function wordLayer() {
    const layer = document.createElement('div'); layer.id = 'flock';
    const spans = visibleWords().map(({ t, x, y }) => {
      const span = document.createElement('span');
      span.textContent = t; span.style.left = x + 'px'; span.style.top = y + 'px';
      layer.append(span);
      return { span, x: x + span.textContent.length * 4, y: y + 9 };   // 단어 가운데쯤
    });
    codeEl.style.opacity = 0;
    document.body.append(layer);
    return [spans, () => {
      layer.remove();
      codeEl.animate([{ opacity: 0, filter: 'brightness(2)' }, { opacity: 1, filter: 'brightness(1)' }], { duration: 800, easing: 'ease-out' });   // 다시 밝아지듯
      codeEl.style.opacity = '';
    }];
  }
  function erupt() {
    const words = visibleWords();
    const lava = document.createElement('div'); lava.id = 'flock';
    const far = Math.hypot(innerWidth / 2, innerHeight), cool = getComputedStyle(codeEl).color;
    words.forEach(({ t, x, y }) => {
      const span = document.createElement('span');
      span.textContent = t; span.style.left = x + 'px'; span.style.top = y + 'px';
      lava.append(span);
      const fly = y + 60 + Math.random() * 200;      // 화면 위 바깥까지
      const drift = (Math.random() - 0.5) * 120, spin = (Math.random() - 0.5) * 50;
      // 아래 가운데에서 가까운 단어부터 먼저 터져 나간다 (분출이 퍼져 나가는 느낌)
      const wave = Math.hypot(x - innerWidth / 2, innerHeight - y) / far;
      span.animate([
        { transform: 'none', color: cool, opacity: 1 },
        { transform: `translate(${drift * 0.3}px, -20px)`, color: '#ff4d1a', opacity: 1, offset: 0.15 },
        { transform: `translate(${drift}px, ${-fly}px) rotate(${spin}deg)`, color: '#ffb020', opacity: 0 },
      ], { duration: 900 + Math.random() * 400, delay: wave * 300 + Math.random() * 100, easing: 'cubic-bezier(.3,.1,.8,.6)', fill: 'both' });
    });
    codeEl.style.opacity = 0;
    document.body.append(lava);
    document.documentElement.classList.add('broken');
    setTimeout(() => {                  // 다 날아가면 코드가 서서히 다시 나타난다
      lava.remove(); document.documentElement.classList.remove('broken');
      codeEl.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 800, easing: 'ease-in-out' });
      codeEl.style.opacity = '';
    }, 2000);
  }
  // 자석: 몇 초 동안 코드 단어들이 마우스 쪽으로 끌려와 따라다니다 제자리로.
  // 0~2단계는 최소한: 마우스 가까운 단어만 살짝 (0단계 가장 좁고 약하게·뚝뚝 끊기며 / 1·2단계 조금 더 넓게·부드럽게)
  // 3단계: 화면 반대편 단어까지, 자리는 거의 그대로 마우스 쪽으로 엿가락처럼 늘어나며 보라빛 + 빛
  let magnetOn = false;
  function magnet() {
    if (magnetOn) return;
    magnetOn = true; finishTyping();
    // 단어는 캔버스 한 장에 그린다 (단어 span마다 위치·색을 매 프레임 바꾸면 프레임이 크게 떨어진다)
    const q = quality, LONG = 4200, words = visibleWords();
    const REACH = [[160, 0.2], [260, 0.3], [360, 0.4]];   // 0~2단계: [끌리는 거리(px), 최대 세기] — 최소한으로
    const STEP = 3 * Math.PI / 180;
    let last = -1e9, sized = false;
    const cv = charCanvas('flock', (ctx, t) => {
      if (t > LONG + 900) {             // 끝: 코드가 다시 밝아지듯 제자리에
        cv.remove(); magnetOn = false;
        codeEl.animate([{ opacity: 0, filter: 'brightness(2)' }, { opacity: 1, filter: 'brightness(1)' }], { duration: 800, easing: 'ease-out' });
        codeEl.style.opacity = codeEl.style.visibility = ''; return;
      }
      ctx.font = font;
      if (!sized) { words.forEach(w => { w.hw = ctx.measureText(w.t).width / 2; w.dx = w.dy = w.pull = w.s = w.ang = 0; }); sized = true; }
      const power = t < LONG ? Math.min(1, t / 400) : Math.max(0, 1 - (t - LONG) / 700);   // 서서히 켜졌다 꺼짐
      if (!(q === 0 && t - last < 120)) {  // 0단계: 일부러 뚝뚝 (움직임만 띄엄띄엄 갱신)
        last = t;
        const ease = q === 0 ? 1 : 0.15;   // 0단계는 바로 그 자리로, 나머지는 따라오듯
        const diag = Math.hypot(innerWidth, innerHeight);
        for (const w of words) {
          const mx = lastX - (w.x + w.hw), my = lastY - (w.y + 9), d = Math.hypot(mx, my);
          w.pull = q >= 3
            ? power * (0.35 + 0.5 * Math.max(0, 1 - d / diag))          // 3단계: 화면 반대편 단어까지 당겨진다
            : power * Math.max(0, 1 - d / REACH[q][0]) ** 1.5 * REACH[q][1];  // 0~2단계: 가까운 단어만 조금 (가까울수록 세게)
          const move = q >= 3 ? w.pull * 0.06 : w.pull;   // 3단계는 자리는 거의 그대로, 대신 늘어난다
          w.dx += (mx * move - w.dx) * ease; w.dy += (my * move - w.dy) * ease;
          if (q >= 3) { w.s += (w.pull * 0.7 - w.s) * ease; w.ang = Math.atan2(my, mx); }
        }
      }
      // 3단계만 끌릴수록 보라빛 (코드 색 위에 보라를 겹쳐 물들임) + 빛 (빛 세기도 몇 단계로 묶음)
      for (const pass of q >= 3 ? [0, 1] : [0]) {
        ctx.fillStyle = pass ? accent : base;
        ctx.shadowColor = accent;
        for (const w of words) {
          const a = q >= 3 ? (pass ? w.pull : 1 - w.pull) : 1;
          if (a <= 0.01) continue;
          ctx.globalAlpha = a;
          ctx.shadowBlur = pass ? Math.round(w.pull * 5) * 2 : 0;
          ctx.setTransform(dpr, 0, 0, dpr, (w.x + w.hw + w.dx) * dpr, (w.y + 9.75 + w.dy) * dpr);
          // 3단계: 마우스 쪽으로 엿가락처럼 늘어난다 — 마우스 반대쪽 끝은 제자리에 두고 마우스 쪽으로만 길어짐.
          // 늘어남(0.1)·방향(3도)은 몇 단계로 묶어 같은 글자 모양을 다시 쓴다 (매 프레임 새 모양이면 느려진다)
          const s = Math.round(w.s * 10) / 10;
          if (s > 0) {
            const ang = Math.round(w.ang / STEP) * STEP, c = Math.cos(ang), n = Math.sin(ang);
            const ext = (Math.abs(c) * w.hw + Math.abs(n) * 6) * s;   // 늘어난 만큼 마우스 쪽으로 밀어 반대쪽 끝을 고정
            ctx.translate(c * ext, n * ext); ctx.rotate(ang); ctx.scale(1 + s, 1); ctx.rotate(-ang);
          }
          ctx.fillText(w.t, -w.hw, 0);
        }
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.globalAlpha = 1; ctx.shadowBlur = 0;
    });
    const dpr = devicePixelRatio || 1, cs = getComputedStyle(cv);
    const font = `13px ${cs.fontFamily}`, base = cs.color, accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || base;
    codeEl.style.opacity = 0;
    codeEl.style.visibility = 'hidden';   // 숨긴 코드 1,000여 줄을 아예 안 그리게 (투명만 하면 캔버스가 바뀔 때마다 같이 다시 그려진다)
  }
  // 블랙홀: 렌즈(마우스) 자리로 코드와 앞 창이 소용돌이치며 빨려 들어가 사라졌다가, 다시 밝아지듯 제자리에 나타난다.
  // 0단계 뚝뚝 끊기며 / 1단계 부드럽게 / 2단계 단어가 돌며 / 3단계는 gargantua() — 코드가 블랙홀 모양이 된다
  let holeOn = false;
  function blackhole() {
    if (holeOn) return;
    holeOn = true; finishTyping();
    if (quality >= 3) return gargantua();
    const q = quality, cx = lastX, cy = lastY;
    const [words, done] = wordLayer();
    const pull = (el, x, y, spinSelf) => {          // 한 요소를 (cx, cy)로 소용돌이치며 빨아들이는 움직임
      const a0 = Math.atan2(y - cy, x - cx), r0 = Math.hypot(x - cx, y - cy), frames = [];
      for (let i = 0; i <= 12; i++) {
        const t = i / 12, a = a0 + 4.5 * t * t, r = r0 * (1 - t) ** 1.6;
        frames.push({ transform: `translate(${cx + Math.cos(a) * r - x}px, ${cy + Math.sin(a) * r - y}px) rotate(${spinSelf * t}deg) scale(${1 - 0.9 * t})`,
          opacity: 1 - t });                // 끝까지 빨려 들어가 사라진다
      }
      return el.animate(frames, { duration: 1300, delay: Math.min(400, r0 * 0.3), easing: q === 0 ? 'steps(30)' : 'cubic-bezier(.5,0,.8,.6)', fill: 'both' });
    };
    const anims = words.map(w => pull(w.span, w.x, w.y, q >= 2 ? 540 : 0));
    pieces().forEach(el => {
      const r = el.getBoundingClientRect();
      anims.push(pull(el, r.left + r.width / 2, r.top + r.height / 2, q >= 2 ? 360 : 0));
    });
    anims.push(screenEl.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 900, delay: 800, fill: 'both' }));   // 창 유리도 사라진다
    document.documentElement.classList.add('flying');
    setTimeout(() => {                  // 다 사라진 뒤, 다시 밝아지듯 코드가 먼저 → 그다음 창
      done();
      setTimeout(() => {
        screenEl.animate([{ opacity: 0, filter: 'brightness(2)' }, { opacity: 1, filter: 'brightness(1)' }], { duration: 1000, easing: 'ease-out' });
        anims.forEach(a => a.cancel());
        document.documentElement.classList.remove('flying');
        holeOn = false;
      }, 700);
    }, 2200);
  }
  // 블랙홀 3단계: 검은 구멍이 서서히 열리고, 가까운 단어부터 줄줄이 천천히 소용돌이치며 끌려와
  // 금빛으로 물들어 납작한 원반(강착원반)과 구멍을 감싸는 빛 테두리가 되어 돈다 → 사그라들고 코드·창 순서로 서서히 돌아온다
  function gargantua() {
    const R = Math.min(innerWidth, innerHeight) * 0.08, cool = getComputedStyle(codeEl).color;
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));   // 마우스가 가장자리여도 원반이 화면 안에 다 보이게
    const cx = clamp(lastX, R * 4.5, innerWidth - R * 4.5), cy = clamp(lastY, R * 2, innerHeight - R * 2.5);
    const [words, done] = wordLayer();
    const layer = document.getElementById('flock'); layer.classList.add('garg');
    const hole = document.createElement('div'); hole.id = 'hole';
    Object.assign(hole.style, { left: cx + 'px', top: cy + 'px', width: R * 2.4 + 'px', height: R * 2.4 + 'px' });
    layer.append(hole);                 // 원반 단어가 구멍 앞·뒤로 지나가도록 같은 층에
    const END = 6000;                   // 이때까지 원반이 돈다
    hole.animate([{ transform: 'translate(-50%, -50%) scale(0)' }, { transform: 'translate(-50%, -50%) scale(1)', offset: 0.3 },
      { transform: 'translate(-50%, -50%) scale(1.08)', offset: 0.9 }, { transform: 'translate(-50%, -50%) scale(0)' }],
      { duration: END + 700, easing: 'ease-in-out', fill: 'forwards' });
    const far = Math.max(...words.map(w => Math.hypot(w.x - cx, w.y - cy)), 1);
    const tilt = -8 * Math.PI / 180, cosT = Math.cos(tilt), sinT = Math.sin(tilt);
    words.forEach(w => {
      const r0 = Math.hypot(w.x - cx, w.y - cy), a0 = Math.atan2(w.y - cy, w.x - cx);
      const ring = Math.random() < 0.35;              // 35%는 구멍을 감싸는 빛 테두리, 나머지는 납작한 원반
      const ax = ring ? R * (1.25 + Math.random() * 0.3) : R * (1.7 + Math.random() * 2.4);
      const ay = ring ? ax : ax * 0.17;
      const delay = r0 / far * 2000 + Math.random() * 250;   // 가까운 단어부터 줄줄이
      const D = END - delay, spinIn = 2.5 + Math.random() * 6.3, w0 = 1.1 * R / ax;   // 안쪽일수록 빨리 돈다 (rad/s)
      const frames = [];
      for (let i = 0; i <= 32; i++) {
        const t = i / 32, s = 0.45;                // 앞 45%: 소용돌이치며 들어옴 / 뒤: 제자리 궤도를 돈다
        let phi, rx, ry, k;
        if (t <= s) { const u = t / s; k = u * u * (3 - 2 * u);
          phi = a0 + spinIn * k; rx = r0 + (ax - r0) * k; ry = r0 + (ay - r0) * k; }
        else { k = 1; phi = a0 + spinIn + w0 * (t - s) * D / 1000; rx = ax; ry = ay; }
        const ex = Math.cos(phi) * rx, ey = Math.sin(phi) * ry;
        const px = cx + ex * cosT - ey * sinT, py = cy + ex * sinT + ey * cosT;
        frames.push({ transform: `translate(${px - w.x}px, ${py - w.y}px) scale(${1 - 0.35 * k})`,
          color: k < 0.5 ? cool : ring ? '#fff3dc' : '#ffbf7a', offset: t,
          zIndex: !ring && k === 1 && Math.sin(phi) > 0 ? 10 : 1 });   // 원반 앞쪽 절반은 구멍 앞을 지난다
      }
      w.span.animate(frames, { duration: D, delay, easing: 'linear', fill: 'both' });
    });
    const flights = [...pieces()].map(el => {     // 앞 창 글자도 천천히 소용돌이치며 구멍 속으로
      const r = el.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
      const a0 = Math.atan2(y - cy, x - cx), r0 = Math.hypot(x - cx, y - cy), frames = [];
      for (let i = 0; i <= 12; i++) {
        const t = i / 12, a = a0 + 3 * t * t, rr = r0 * (1 - t) ** 1.4;
        frames.push({ transform: `translate(${cx + Math.cos(a) * rr - x}px, ${cy + Math.sin(a) * rr - y}px) scale(${1 - 0.95 * t})`, opacity: 1 - t });
      }
      return el.animate(frames, { duration: 2600, delay: 900 + Math.random() * 900, easing: 'cubic-bezier(.4,0,.7,1)', fill: 'both' });
    });
    flights.push(screenEl.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 1500, delay: 1800, fill: 'both' }));
    document.documentElement.classList.add('flying');
    setTimeout(() => layer.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 700, fill: 'forwards' }), END);   // 사그라든다
    setTimeout(() => {                  // 코드가 먼저 서서히 → 그다음 창
      hole.remove(); done();
      setTimeout(() => {
        screenEl.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 1000, easing: 'ease-in-out' });
        flights.forEach(a => a.cancel());
        document.documentElement.classList.remove('flying');
        holeOn = false;
      }, 800);
    }, END + 750);
  }
  // 앞 창 날아가기 (3단계 펑): 창이 덜덜 떨고 → 조각들이 터진 자리 반대쪽으로 돌며 날아가고, 창 유리도 사라졌다가 → 제자리에 서서히 나타난다
  function blowAway(bx, by, wait = 550, calm = 0, glitch = false) {   // wait: 떨리는 시간 (0이면 떨지 않고 바로 터짐) / calm: 0~1, 클수록 느리고 덜 격하게
    let flights = [], tick = null;
    if (glitch) {                       // 글자가 오류 나듯 점점 심하게 깨지고 빨강·파랑으로 어긋난 채 날아간다
      const g0 = performance.now();
      tick = setInterval(() => {
        const k = Math.min(1, (performance.now() - g0) / (wait + 500));
        pieces().forEach(el => {
          if (!saved.has(el)) saved.set(el, textOf(el));
          setText(el, saved.get(el).replace(/\S/g, c => Math.random() < k * 0.7 ? GLYPHS[Math.floor(Math.random() * GLYPHS.length)] : c));
          el.style.textShadow = `${4 * k}px 0 rgba(255,0,70,.8), ${-4 * k}px 0 rgba(0,220,255,.8)`;
        });
      }, 70);
      setTimeout(() => clearInterval(tick), wait + 1000);   // 다 날아가 안 보이면 멈춘다
    }
    if (wait) screenEl.classList.add('jolt');
    setTimeout(() => {
      screenEl.classList.remove('jolt');
      document.documentElement.classList.add('flying');
      flights = [...pieces()].map(el => {
        const r = el.getBoundingClientRect();
        const dx = r.left + r.width / 2 - bx, dy = r.top + r.height / 2 - by, d = Math.hypot(dx, dy) || 1;
        const far = (700 + Math.random() * 500) * (1 - calm * 0.4);
        const tx = dx / d * far + (Math.random() - 0.5) * 300, ty = dy / d * far + (Math.random() - 0.5) * 300 - 120;
        return el.animate([{ transform: 'none', opacity: 1 },
          { transform: `translate(${tx}px, ${ty}px) rotate(${(Math.random() - 0.5) * 720 * (1 - calm * 0.6)}deg) scale(0.7)`, opacity: 0 }],
          { duration: 750 * (1 + calm * 0.6), delay: Math.random() * 80, easing: 'cubic-bezier(.15,.7,.3,1)', fill: 'forwards' });
      });
      flights.push(screenEl.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'scale(1.08)' }],
        { duration: 500 * (1 + calm * 0.6), easing: 'ease-out', fill: 'forwards' }));
    }, wait);
    return () => {                      // 조각을 다시 모으지 않고, 보이지 않는 사이 제자리에 두었다가 서서히 나타난다
      if (tick) { clearInterval(tick); mend(); }   // 깨진 글자를 원래대로
      const back = screenEl.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 1000, easing: 'ease-in-out' });
      flights.forEach(a => a.cancel());
      back.finished.then(() => document.documentElement.classList.remove('flying'));
    };
  }
  function mend() {                     // 터진 글자를 원래대로 되돌린다
    pieces().forEach(el => {
      if (saved.has(el)) setText(el, saved.get(el));
      el.style.textShadow = '';
      if (el.classList.contains('pop')) {
        el.classList.remove('pop'); void el.offsetWidth;
        el.style.animationDelay = (Math.random() * 0.2) + 's';
        el.classList.add('unpop');
        setTimeout(() => el.classList.remove('unpop'), 900);
      }
    });
    saved.clear();
    setTimeout(() => document.documentElement.classList.remove('broken'), 750);
  }
  function restore() {
    const todo = [...broken];
    restoring = setInterval(() => {
      for (let k = 0; k < 6 && todo.length; k++) {   // 한 번에 몇 줄씩 되돌린다
        const i = todo.splice(Math.floor(Math.random() * todo.length), 1)[0];
        setLine(i);
        broken.delete(i);
      }
      if (!todo.length) { clearInterval(restoring); power = 0; shaking = false; apply(); mend(); }
    }, 30);
  }

  // 렌즈 크기
  let radius = 140;
  const ring = document.createElement('div');   // 3단계에서 보이는 렌즈 테두리
  ring.id = 'ring';
  function setRadius(r) { radius = Math.max(60, Math.min(400, r)); codeEl.style.setProperty('--r', radius + 'px'); }
  document.getElementById('bigger').addEventListener('click', () => setRadius(radius + 60));
  document.getElementById('smaller').addEventListener('click', () => setRadius(radius - 60));

  // 영문 / 한자: 앞 화면 글자를 바꾸고, 뒤 코드의 그 줄도 같이 바꾼다. 같은 버튼을 다시 누르면 한글로
  let lang = 'ko';
  const DARK_LABEL = { ko: ['블랙 모드', '화이트 모드'], en: ['Dark mode', 'Light mode'], hj: ['黑色模式', '白色模式'] };
  const WORDS = [
    { sel: 'h1', ko: '투명창', en: 'Glass Window', hj: '透明窓' },
    { sel: '#screen p', ko: '이 페이지는 자기 자신의 코드를 겹쳐 보여줍니다. (더미 내용)',
      en: 'This page shows its own code layered behind it. (dummy text)',
      hj: '此頁示其自身之碼，重疊於後。（假內容）' },
    { sel: '#shake', ko: '코드 뒤섞기 (막 눌러 보세요)', en: 'Scramble code (mash it!)', hj: '攪亂代碼（請連擊）' },
    { sel: '#bigger', ko: '렌즈 크게', en: 'Bigger lens', hj: '放大透鏡' },
    { sel: '#smaller', ko: '렌즈 작게', en: 'Smaller lens', hj: '縮小透鏡' },
    { sel: '#retype', ko: '타자 다시 보기', en: 'Replay typing', hj: '重看打字' },
    { sel: '#memo', attr: 'placeholder', ko: '여기에 글자를 적어 보세요', en: 'Type something here', hj: '請於此處書寫文字' },
    { sel: '#screen li:nth-child(1)', ko: '목록 하나', en: 'Item one', hj: '目錄一' },
    { sel: '#screen li:nth-child(2)', ko: '목록 둘', en: 'Item two', hj: '目錄二' },
    { sel: '#bar > span:first-child', ko: '창', en: 'Window', hj: '窓' },
    { sel: '#down', ko: '◀ 불투명', en: '◀ Opaque', hj: '◀ 不透明' },
    { sel: '#up', ko: '투명 ▶', en: 'Clear ▶', hj: '透明 ▶' },
  ];
  const EGG = { ko: '버튼', en: 'button', hj: '按鈕' };   // 코드 속 숨은 글자
  const EGG_TEXT = { ko: '이스터에그', en: 'Easter egg', hj: '彩蛋' };   // 누르면 글상자에 적히는 말
  // 코드 줄 번역표: lang.json { "한글 줄": { en, hj } } — 없는 줄은 한글 그대로
  let LINES = {};
  fetch('lang.json').then(r => r.json()).then(j => { LINES = j; }).catch(() => {});
  function tr(line, l) {
    const t = l !== 'ko' && LINES[line.trim()]?.[l];
    return t ? line.slice(0, line.length - line.trimStart().length) + t : line;
  }
  function setLang(next) {
    finishTyping();
    WORDS.forEach(w => {
      const el = document.querySelector(w.sel);
      if (w.attr) el.setAttribute(w.attr, w[next]); else el.textContent = w[next];
    });
    lang = next;
    // 뒤 코드도 줄마다 그 언어로 (입력칸 줄은 적은 글자를 다시 붙인다)
    orig = pristine.map(t => tr(t, lang));
    lines.forEach((s, i) => setLine(i));
    if (memoIdx >= 0) { memoBase = orig[memoIdx]; writeMemoLine(); }
    document.documentElement.lang = next === 'en' ? 'en' : 'ko';
    document.getElementById('en').setAttribute('aria-pressed', lang === 'en');
    document.getElementById('hj').setAttribute('aria-pressed', lang === 'hj');
    setDark(document.documentElement.classList.contains('dark'));   // 블랙 모드 버튼 이름도 바꾼다
    setQuality(quality);
  }
  document.getElementById('en').addEventListener('click', () => setLang(lang === 'en' ? 'ko' : 'en'));
  document.getElementById('hj').addEventListener('click', () => setLang(lang === 'hj' ? 'ko' : 'hj'));

  // 퀄리티 업: 누를 때마다 디자인이 한 단계씩 좋아진다 (최대 3단계, 그다음 누르면 처음으로)
  const QUALITY_LABEL = { ko: '퀄리티 업', en: 'Quality up', hj: '品質提升' };
  const STAGE = { ko: ['기본', '정돈', '디자인', '완성'], en: ['Basic', 'Tidy', 'Designed', 'Polished'], hj: ['基本', '整頓', '設計', '完成'] };
  let quality = 0;
  function setQuality(q) {
    quality = q;
    const root = document.documentElement;
    [1, 2, 3].forEach(n => root.classList.toggle('q' + n, q >= n));   // 단계는 쌓인다
    document.getElementById('quality').textContent = `${QUALITY_LABEL[lang]} · ${STAGE[lang][q]} ${q}/3`;
  }
  document.getElementById('quality').addEventListener('click', () => {
    const next = (quality + 1) % 4;
    if (next === 0) {                   // 처음으로 돌아갈 때는 부드럽게 겹쳐 바꾼다
      if (document.startViewTransition) document.startViewTransition(() => setQuality(0));
      else setQuality(0);
      return;
    }
    setQuality(next);
    // 오를 때는 화면 요소들이 차례로 떠오른다
    const items = [...screenEl.children, document.getElementById('bar')];
    items.forEach((el, k) => {
      el.classList.remove('rise'); void el.offsetWidth;
      el.style.animationDelay = (k * 0.06) + 's';
      el.classList.add('rise');
    });
    setTimeout(() => items.forEach(el => el.classList.remove('rise')), 1200);
  });

  // 블랙 모드: 누를 때마다 켜고 끈다, 고른 것은 이 브라우저에 기억
  const darkBtn = document.getElementById('dark');
  function setDark(on) {
    document.documentElement.classList.toggle('dark', on);
    darkBtn.textContent = DARK_LABEL[lang][on ? 1 : 0];
    try { localStorage.setItem('dark', on ? '1' : '0'); } catch (e) {}
  }
  darkBtn.addEventListener('click', () => {
    const next = !document.documentElement.classList.contains('dark');
    if (document.startViewTransition) document.startViewTransition(() => setDark(next));
    else setDark(next);                 // 지원 안 하는 브라우저는 바로 바꾼다
  });
  try { if (localStorage.getItem('dark') === '1') setDark(true); } catch (e) {}

  // 자기 자신의 원본 코드를 가져온다 (file://로 열면 실패 → 현재 DOM으로 대체)
  fetch(location.href)
    .then(r => r.text())
    .then(showCode)
    .catch(() => showCode('<!doctype html>\n' + document.documentElement.outerHTML));
</script>
</body>
</html>
