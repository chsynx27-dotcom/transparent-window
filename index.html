<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>투명창</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg: #fff; --fg: #000; --code: #111; --line: #ccc; color-scheme: light; }
  /* 블랙 모드: 색만 바꾼다 */
  :root.dark { --bg: #0d0d0d; --fg: #f2f2f2; --code: #e6e6e6; --line: #333; color-scheme: dark; }
  body { margin: 0; font-family: sans-serif; background: var(--bg); color: var(--fg); }
  #screen { position: relative; z-index: 1; padding: 24px; padding-bottom: 80px; }
  #code {
    position: fixed; inset: 0 0 56px 0; margin: 0; padding: 24px;
    overflow: auto; font: 13px/1.5 monospace; white-space: pre-wrap;
    pointer-events: none; z-index: 0; color: var(--code);
    /* 투시 렌즈: 마우스 둘레는 코드가 또렷, 나머지는 단계 버튼 값만큼 */
    --x: -9999px; --y: -9999px; --base: 0.5; --r: 140px;
    -webkit-mask-image: radial-gradient(circle var(--r) at var(--x) var(--y), #000 60%, rgba(0,0,0,var(--base)) 100%);
            mask-image: radial-gradient(circle var(--r) at var(--x) var(--y), #000 60%, rgba(0,0,0,var(--base)) 100%);
  }
  #bar {
    position: fixed; left: 0; right: 0; bottom: 0; height: 56px;
    display: flex; align-items: center; gap: 12px; padding: 0 16px;
    border-top: 1px solid var(--line); background: var(--bg);
  }
  #dots { letter-spacing: 4px; font-size: 18px; }
  /* 단계가 바뀔 때 코드 진하기가 점점 바뀌도록 */
  @property --base { syntax: '<number>'; inherits: true; initial-value: 0.5; }
  @property --r { syntax: '<length>'; inherits: true; initial-value: 140px; }
  #code { transition: --base 0.4s, --r 0.3s; }
  /* 첫 연출: 타자가 끝나면 꽉 찬 코드가 렌즈 크기로 줄어든다 */
  #code.shrink { transition: --base 1.4s ease-in-out, --r 1.4s ease-in-out; }
  #screen { transition: opacity 0.8s; }
  body.intro #screen { opacity: 0; }
  #screen > *, #screen li, #screen button { cursor: pointer; }
  #tools { display: flex; flex-wrap: wrap; gap: 8px; }
  #memo { margin-top: 16px; font-size: 16px; padding: 6px; }
  .hit { background: #ffe14d; color: #111; transition: background 0.3s; }
</style>
</head>
<body class="intro">
<main id="screen">
  <h1>투명창</h1>
  <p>이 페이지는 자기 자신의 코드를 겹쳐 보여줍니다. (더미 내용)</p>
  <div id="tools">
    <button type="button" id="shake">코드 뒤섞기 (막 눌러 보세요)</button>
    <button type="button" id="bigger">렌즈 크게</button>
    <button type="button" id="smaller">렌즈 작게</button>
    <button type="button" id="retype">타자 다시 보기</button>
    <button type="button" id="dark">블랙 모드</button>
  </div>
  <input id="memo" type="text" placeholder="여기에 글자를 적어 보세요" size="30">
  <ul>
    <li>목록 하나</li>
    <li>목록 둘</li>
  </ul>
</main>

<pre id="code" aria-hidden="true"></pre>

<div id="bar">
  <span>창</span>
  <button type="button" id="down">◀ 불투명</button>
  <span id="dots" aria-live="polite"></span>
  <button type="button" id="up">투명 ▶</button>
</div>

<script>
  const screenEl = document.getElementById('screen');
  const codeEl = document.getElementById('code');
  const dots = document.getElementById('dots');

  // 화면 글자는 항상 진하게(앞). 좌우 버튼으로 뒤에 깔린 코드의 진하기를 5단계로 바꾼다.
  let level = 2;                        // 0 = 코드 안 보임 … 4 = 코드 또렷
  let shaking = false;                  // 뒤섞는 동안은 코드를 다 보이게
  let typing = false;                   // 타자 치는 동안도 코드를 다 보이게
  function apply() {
    codeEl.style.setProperty('--base', shaking || typing ? 1 : level / 4);
    const shown = typing ? 4 : level;  // 타자 중에는 끝까지 투명(코드 다 보임)으로 표시
    dots.textContent = '●'.repeat(shown + 1) + '○'.repeat(4 - shown);   // 지금 단계 표시
    dots.setAttribute('aria-label', `창 투명도 ${shown + 1}/5단계`);
  }
  document.getElementById('down').addEventListener('click', () => { level = Math.max(0, level - 1); apply(); });
  document.getElementById('up').addEventListener('click', () => { level = Math.min(4, level + 1); apply(); });
  apply();

  // 투시 렌즈: 마우스(손가락)가 있는 곳만 뒤의 코드가 비쳐 보인다
  let lastX = innerWidth / 2, lastY = innerHeight / 2;   // 마지막 마우스 위치 (없으면 화면 가운데)
  addEventListener('pointermove', e => { lastX = e.clientX; lastY = e.clientY; });
  function lens(x, y) {
    codeEl.style.setProperty('--x', x + 'px');
    codeEl.style.setProperty('--y', y + 'px');
  }
  let holdLens = 0;                     // 짝 찾기 직후 렌즈를 잠깐 고정
  addEventListener('pointermove', e => { if (Date.now() > holdLens) lens(e.clientX, e.clientY); });
  document.documentElement.addEventListener('pointerleave', () => lens(-9999, -9999));

  // 코드를 줄 단위로 넣는다 (짝 찾기에서 줄을 집어내려고)
  let lines = [];
  let orig = [];                        // 원본 줄 (뒤섞여도 이걸로 되돌린다)
  function showCode(src) {
    codeEl.textContent = '';
    orig = src.split('\n');
    memoIdx = orig.findIndex(t => t.trim().startsWith('<input id="memo"'));
    memoBase = memoIdx >= 0 ? orig[memoIdx] : '';
    lines = orig.map(text => {
      const span = document.createElement('span');
      codeEl.appendChild(span);
      return span;
    });
    typeOut();
  }

  // 타자 효과: 코드가 누가 치는 것처럼 한 글자씩 쓰여 나간다
  const SPEED = 30;                     // 한 프레임(약 1/60초)에 치는 글자 수
  let typeFrame = null;
  function typeOut() {
    cancelAnimationFrame(typeFrame);
    lines.forEach(s => { s.textContent = ''; });
    codeEl.scrollTop = 0;
    typing = true; apply();
    // 불투명으로 시작: 앞 화면은 숨기고, 렌즈를 화면 전체 크기로 키운다
    document.body.classList.add('intro');
    codeEl.classList.remove('shrink');
    codeEl.style.setProperty('--r', Math.hypot(innerWidth, innerHeight) + 'px');
    lens(innerWidth / 2, innerHeight / 2);
    holdLens = Infinity;
    let li = 0, pos = 0;
    function step() {
      let budget = SPEED;
      while (budget > 0 && li < lines.length) {
        const text = orig[li];
        const take = Math.min(budget, text.length - pos);
        pos += take; budget -= take;
        if (pos >= text.length) {       // 이 줄 끝 → 다음 줄
          lines[li].textContent = text + '\n';
          li++; pos = 0; budget--;
        } else {
          lines[li].textContent = text.slice(0, pos) + '▌\n';
        }
      }
      // 치고 있는 줄이 화면 아래로 내려가면 따라 내려간다
      const cur = lines[Math.min(li, lines.length - 1)];
      if (cur.offsetTop > codeEl.scrollTop + codeEl.clientHeight * 0.7)
        codeEl.scrollTop = cur.offsetTop - codeEl.clientHeight * 0.7;
      if (li < lines.length) typeFrame = requestAnimationFrame(step);
      else finishTyping();
    }
    typeFrame = requestAnimationFrame(step);
  }
  function finishTyping() {             // 다 쳤거나, 중간에 다른 기능을 누르면 바로 끝낸다
    if (!typing) return;
    cancelAnimationFrame(typeFrame);
    lines.forEach((s, i) => { s.textContent = orig[i] + '\n'; });
    codeEl.scrollTo({ top: 0, behavior: 'smooth' });
    // 꽉 찬 코드가 마우스 자리의 렌즈로 쪼그라들고, 앞 화면이 떠오른다
    codeEl.classList.add('shrink');
    lens(lastX, lastY);
    codeEl.style.setProperty('--r', radius + 'px');
    typing = false; apply();
    document.body.classList.remove('intro');
    holdLens = Date.now() + 1400;
    setTimeout(() => codeEl.classList.remove('shrink'), 1400);
  }
  // 타자 중에 아무 데나 누르면 건너뛴다
  addEventListener('click', () => { if (typing) finishTyping(); }, true);
  document.getElementById('retype').addEventListener('click', e => { e.stopPropagation(); typeOut(); });

  // 짝 찾기: 화면 요소를 누르면 그 요소를 만든 코드 줄이 반짝인다
  screenEl.addEventListener('click', e => {
    if (e.target.id === 'shake') return;  // 뒤섞기는 짝 찾기 대신 뒤섞기만
    finishTyping();
    const el = e.target.closest('#screen button, #screen li, #screen > *');
    if (!el) return;
    const first = el.outerHTML.split('\n')[0].trim();
    // 화면(main) 부분의 줄에서만 찾는다 — 스크립트 속 같은 글자는 제외
    const start = orig.findIndex(t => t.includes('<main id="screen">'));
    const end = orig.findIndex((t, i) => i > start && t.includes('</main>'));
    const idx = orig.findIndex((t, i) => i > start && i < end && t.trim().startsWith(first));
    const found = el.id === 'memo' ? memoIdx : idx;   // 입력칸 줄은 글자가 들어가 모양이 바뀌므로 따로 기억
    if (found < 0) return;
    flash(found);
  });

  // 코드 줄 하나를 반짝이고 렌즈를 그 줄로 옮긴다
  let flashTimer = null;
  function flash(i) {
    const line = lines[i];
    lines.forEach(s => s.classList.remove('hit'));
    line.classList.add('hit');
    line.scrollIntoView({ block: 'center' });
    const r = line.getBoundingClientRect();
    lens(r.left + 120, r.top + r.height / 2);
    holdLens = Date.now() + 1500;
    clearTimeout(flashTimer);
    flashTimer = setTimeout(() => line.classList.remove('hit'), 1500);
  }

  // 앞에서 글자를 적으면 뒤의 코드(입력칸 줄)에 그대로 써진다
  let memoIdx = -1;
  const memo = document.getElementById('memo');
  memo.addEventListener('input', () => {
    if (memoIdx < 0) return;
    finishTyping();
    const v = memo.value.replace(/&/g, '&amp;').replace(/"/g, '&quot;');
    orig[memoIdx] = memoBase.replace(/>$/, v ? ` value="${v}">` : '>');
    lines[memoIdx].textContent = orig[memoIdx] + '\n';
    flash(memoIdx);
  });
  let memoBase = '';

  // 코드 뒤섞기: 누를 때마다 코드가 더 많이 깨지고, 손을 떼면 한 줄씩 원래대로 돌아온다
  const GLYPHS = '█▓▒░<>/{}=;#*$%&@!?01';
  let power = 0, restoreTimer = null, restoring = null;
  const broken = new Set();
  document.getElementById('shake').addEventListener('click', () => {
    finishTyping();
    clearTimeout(restoreTimer); clearInterval(restoring);
    shaking = true; apply();
    power = Math.min(power + 1, 30);
    const n = power * 4;                // 막 누를수록 더 많은 줄이 깨진다
    for (let k = 0; k < n; k++) {
      const i = Math.floor(Math.random() * lines.length);
      lines[i].textContent = orig[i].replace(/\S/g, c =>
        Math.random() < 0.3 + power / 50 ? GLYPHS[Math.floor(Math.random() * GLYPHS.length)] : c) + '\n';
      broken.add(i);
    }
    restoreTimer = setTimeout(restore, 700);
  });
  function restore() {
    const todo = [...broken];
    restoring = setInterval(() => {
      for (let k = 0; k < 6 && todo.length; k++) {   // 한 번에 몇 줄씩 되돌린다
        const i = todo.splice(Math.floor(Math.random() * todo.length), 1)[0];
        lines[i].textContent = orig[i] + '\n';
        broken.delete(i);
      }
      if (!todo.length) { clearInterval(restoring); power = 0; shaking = false; apply(); }
    }, 30);
  }

  // 렌즈 크기
  let radius = 140;
  function setRadius(r) { radius = Math.max(60, Math.min(400, r)); codeEl.style.setProperty('--r', radius + 'px'); }
  document.getElementById('bigger').addEventListener('click', () => setRadius(radius + 60));
  document.getElementById('smaller').addEventListener('click', () => setRadius(radius - 60));

  // 블랙 모드: 누를 때마다 켜고 끈다, 고른 것은 이 브라우저에 기억
  const darkBtn = document.getElementById('dark');
  function setDark(on) {
    document.documentElement.classList.toggle('dark', on);
    darkBtn.textContent = on ? '화이트 모드' : '블랙 모드';
    try { localStorage.setItem('dark', on ? '1' : '0'); } catch (e) {}
  }
  darkBtn.addEventListener('click', () => setDark(!document.documentElement.classList.contains('dark')));
  try { if (localStorage.getItem('dark') === '1') setDark(true); } catch (e) {}

  // 자기 자신의 원본 코드를 가져온다 (file://로 열면 실패 → 현재 DOM으로 대체)
  fetch(location.href)
    .then(r => r.text())
    .then(showCode)
    .catch(() => showCode('<!doctype html>\n' + document.documentElement.outerHTML));
</script>
</body>
</html>
