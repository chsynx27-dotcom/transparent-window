<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>투명창</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root { --bg: #fff; --fg: #000; --code: #111; --line: #ccc; color-scheme: light; }
  /* 블랙 모드: 색만 바꾼다 */
  :root.dark { --bg: #0d0d0d; --fg: #f2f2f2; --code: #e6e6e6; --line: #333; color-scheme: dark; }
  body { margin: 0; font-family: sans-serif; background: var(--bg); color: var(--fg); }
  #screen { position: relative; z-index: 1; padding: 24px; padding-bottom: 80px; }
  #code {
    position: fixed; inset: 0 0 56px 0; margin: 0; padding: 24px;
    overflow: auto; font: 13px/1.5 monospace; white-space: pre-wrap;
    pointer-events: none; z-index: 0; color: var(--code);
    /* 투시 렌즈: 마우스 둘레는 코드가 또렷, 나머지는 단계 버튼 값만큼 */
    --x: -9999px; --y: -9999px; --base: 0.5; --r: 140px;
    -webkit-mask-image: radial-gradient(circle var(--r) at var(--x) var(--y), #000 60%, rgba(0,0,0,var(--base)) 100%);
            mask-image: radial-gradient(circle var(--r) at var(--x) var(--y), #000 60%, rgba(0,0,0,var(--base)) 100%); /* 버튼 */
  }
  #bar {
    position: fixed; left: 0; right: 0; bottom: 0; height: 56px;
    display: flex; align-items: center; gap: 12px; padding: 0 16px;
    border-top: 1px solid var(--line); background: var(--bg);
  }
  #dots { letter-spacing: 4px; font-size: 18px; }
  /* 단계가 바뀔 때 코드 진하기가 점점 바뀌도록 */
  @property --base { syntax: '<number>'; inherits: true; initial-value: 0.5; }
  @property --r { syntax: '<length>'; inherits: true; initial-value: 140px; }
  #code { transition: --base 0.4s, --r 0.3s; }
  /* 첫 연출: 타자가 끝나면 꽉 찬 코드가 렌즈 크기로 줄어든다 */
  #code.shrink { transition: --base 1.4s ease-in-out, --r 1.4s ease-in-out; }
  #screen { transition: opacity 0.8s; }
  body.intro #screen { opacity: 0; }
  #screen > *, #screen li, #screen button { cursor: pointer; }
  #tools { display: flex; flex-wrap: wrap; gap: 8px; }
  /* 블랙/화이트 전환을 부드럽게: 화면 전체가 0.6초에 걸쳐 스르륵 바뀐다 */
  ::view-transition-old(root), ::view-transition-new(root) { animation-duration: 0.6s; animation-timing-function: ease; }
  /* 이스터에그: 코드 속 작은 '버튼' 글자만 누를 수 있다 */
  #screen { pointer-events: none; }
  #screen * { pointer-events: auto; }
  .egg { pointer-events: auto; cursor: pointer; font-size: 9px; }
  .egg:hover { background: #ffe14d; color: #111; }
  /* 퀄리티 업 1단계 '정돈': 글꼴 체계·여백·같은 크기의 버튼 */
  :root.q1 { --muted: #6b7280; }
  :root.q1.dark { --muted: #9ca3af; }
  :root.q1 body { font-family: Pretendard, system-ui, "Malgun Gothic", sans-serif; -webkit-font-smoothing: antialiased; }
  :root.q1 #screen { padding: 56px 56px 120px; }
  :root.q1 h1 { font-size: 56px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.05; margin: 0 0 14px; }
  :root.q1 #screen p { font-size: 18px; line-height: 1.6; color: var(--muted); max-width: 46ch; margin: 0 0 28px; }
  :root.q1 button, :root.q1 #memo { height: 38px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--fg); font-family: inherit; font-size: 14px; font-weight: 500; }
  :root.q1 #memo { width: 340px; height: 44px; margin-top: 20px; font-size: 15px; }
  :root.q1 #screen ul { margin: 24px 0 0; padding-left: 20px; color: var(--muted); line-height: 1.9; }
  :root.q1 #bar { padding: 0 24px; gap: 12px; font-size: 14px; }
  :root.q1 #code { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; }

  /* 2단계 '디자인': 편집기처럼 색 구분된 코드·줄 번호, 떠 있는 조절 막대, 포인트 색 하나 */
  :root.q2 { --accent: #4f46e5; --code: #24292f; --t-c: #6e7781; --t-s: #0a3069; --t-t: #116329; --t-k: #cf222e; --t-n: #0550ae; }
  :root.q2.dark { --accent: #8b87ff; --code: #c9d1d9; --t-c: #8b949e; --t-s: #a5d6ff; --t-t: #7ee787; --t-k: #ff7b72; --t-n: #79c0ff; }
  :root.q2 .t-c { color: var(--t-c); font-style: italic; }
  :root.q2 .t-s { color: var(--t-s); }
  :root.q2 .t-t { color: var(--t-t); }
  :root.q2 .t-k { color: var(--t-k); }
  :root.q2 .t-n { color: var(--t-n); }
  #code { counter-reset: ln; }
  :root.q2 #code > .ln::before { counter-increment: ln; content: counter(ln); display: inline-block; width: 3ch;
    margin-right: 2.5ch; text-align: right; color: var(--t-c); opacity: 0.6; }
  :root.q2 #code { inset: 0; }
  :root.q2 #quality { background: var(--accent); border-color: var(--accent); color: #fff; }
  :root.q2 button { transition: border-color 0.15s, transform 0.15s; }
  :root.q2 button:hover { border-color: var(--accent); }
  :root.q2 button:active { transform: scale(0.97); }
  :root.q2 #memo:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
  :root.q2 #bar { left: 50%; right: auto; bottom: 20px; transform: translateX(-50%); height: 52px;
    border: 1px solid var(--line); border-radius: 999px; box-shadow: 0 8px 30px rgba(0,0,0,0.12); }
  :root.q2 #bar button, :root.q2 #corner button { border-radius: 999px; }
  :root.q2 #dots { color: var(--accent); }
  :root.q2 .hit { background: color-mix(in srgb, var(--accent) 22%, transparent); color: inherit; box-shadow: inset 3px 0 var(--accent); }

  /* 3단계 '완성': 앞 화면이 진짜 창(제목 표시줄이 있는 유리 패널), 렌즈 테두리 */
  :root.q3 #screen { width: min(820px, calc(100% - 32px)); box-sizing: border-box; margin: 72px auto 0; padding: 80px 48px 44px;
    border-radius: 18px; border: 1px solid color-mix(in srgb, var(--fg) 12%, transparent);
    /* 유리 짙기 = 아래 투명/불투명 단계와 연동 (--glass: 0 투명 … 1 불투명) */
    background: linear-gradient(var(--line), var(--line)) 0 48px / 100% 1px no-repeat,
      color-mix(in srgb, var(--bg) calc(var(--glass, 0.5) * 92%), transparent);
    backdrop-filter: blur(calc(var(--glass, 0.5) * 3px)); -webkit-backdrop-filter: blur(calc(var(--glass, 0.5) * 3px));
    transition: background-color 0.4s;
    box-shadow: 0 30px 80px -20px rgba(0,0,0,0.28); }
  :root.q3 #screen::after { content: 'index.html'; position: absolute; top: 15px; left: 0; right: 0; text-align: center;
    font-size: 12px; color: var(--muted); }
  :root.q3 h1 { font-size: 64px; }
  :root.q3 #bar { background: color-mix(in srgb, var(--bg) 70%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  #ring { position: fixed; left: var(--x); top: var(--y); width: calc(var(--r) * 1.2); aspect-ratio: 1;
    transform: translate(-50%, -50%); border-radius: 50%; pointer-events: none; display: none;
    border: 1.5px solid color-mix(in srgb, var(--accent, #888) 70%, transparent);
    box-shadow: 0 0 24px color-mix(in srgb, var(--accent, #888) 45%, transparent); }
  :root.q3 #ring { display: block; }
  /* 단계가 오를 때 요소들이 차례로 떠오른다 */
  .rise { animation: rise 0.6s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  /* 화면이 깨지는 순간: 전체가 한 번 크게 흔들린다 */
  :root.broken { overflow: hidden; }
  :root.broken #screen { animation: quake 0.4s; }
  /* 펑: 부풀며 번지다 사라짐 / 되돌아올 때: 작게 모였다 나타남 */
  .pop { animation: pop 0.45s ease-out both; }
  @keyframes pop { 40% { transform: scale(1.25); filter: blur(1px); opacity: 1; }
    100% { transform: scale(1.8); filter: blur(10px); opacity: 0; } }
  /* 코드 비 (0~2단계): 줄이 한 줄씩 떨어졌다가 되감기듯 올라온다. 1단계만 곧게, 0·2단계는 제멋대로 기울며 */
  #code.rain > .ln { display: block; animation: drop 1.4s cubic-bezier(.5,0,.9,.5) var(--d) both; }
  #code.unrain > .ln { display: block; animation: drop 1s cubic-bezier(.1,.5,.5,1) var(--d) both reverse; }
  @keyframes drop { to { transform: translateY(110vh) rotate(var(--rot)); opacity: 0.15; } }
  /* 1·2단계: 0단계처럼 그냥 떨어지되 빗줄기답게 — 줄마다 속도가 다르고 점점 빨라지며 곧게, 위로 꼬리를 남긴다 */
  #code.rain.rq1 > .ln, #code.rain.rq2 > .ln { animation: fall var(--t) cubic-bezier(.55,0,1,.45) var(--d) both; }
  #code.unrain.rq1 > .ln, #code.unrain.rq2 > .ln { animation: fall 0.9s cubic-bezier(0,.55,.45,1) var(--d) both reverse; }
  @keyframes fall { to { transform: translateY(110vh); opacity: 0.3; } }
  #code.rq1 > .ln { text-shadow: 0 -7px color-mix(in srgb, currentColor 28%, transparent), 0 -15px color-mix(in srgb, currentColor 12%, transparent); }
  #code.rq2 > .ln { text-shadow: 0 -6px color-mix(in srgb, currentColor 45%, transparent),   /* 2단계: 코드 색 그대로 더 긴 꼬리 */
      0 -13px color-mix(in srgb, currentColor 25%, transparent), 0 -21px color-mix(in srgb, currentColor 12%, transparent); }
  /* 코드 비 (3단계): 코드가 먼저 흑백으로 바래고, 글자는 제자리에 둔 채 파란 빗줄기가 글자 속으로만 흘러내린다 */
  #code.gray, #code.gray * { transition: color 0.6s; }
  #code.gray, #code.gray *, #code.gray > .ln::before { color: var(--gray) !important; }
  #code { --gray: #9aa0a6; }
  :root.dark #code { --gray: #5c6066; }
  #code.blue, #code.blue *, #code.blue > .ln::before { color: transparent !important; }
  #code.blue {
    -webkit-background-clip: text; background-clip: text;
    background-image:                   /* 빗방울 머리는 진하게, 꼬리는 위로 옅어짐 */
      radial-gradient(5px 90px at 50% 80%, #2563eb 25%, rgba(37,99,235,0.5) 55%, transparent 70%),
      radial-gradient(6px 120px at 50% 80%, #3b82f6 25%, rgba(59,130,246,0.45) 55%, transparent 70%),
      radial-gradient(4px 70px at 50% 80%, #1d4ed8 25%, rgba(29,78,216,0.5) 55%, transparent 70%),
      linear-gradient(var(--gray), var(--gray));
    background-size: 31px 190px, 53px 260px, 19px 150px, 100% 100%;
    animation: rainfall 1.1s linear infinite; }
  :root.dark #code.blue { background-image:
      radial-gradient(5px 90px at 50% 80%, #60a5fa 25%, rgba(96,165,250,0.5) 55%, transparent 70%),
      radial-gradient(6px 120px at 50% 80%, #93c5fd 25%, rgba(147,197,253,0.45) 55%, transparent 70%),
      radial-gradient(4px 70px at 50% 80%, #3b82f6 25%, rgba(59,130,246,0.5) 55%, transparent 70%),
      linear-gradient(var(--gray), var(--gray)); }
  @keyframes rainfall { from { background-position: 0 0, 14px 60px, 7px 100px, 0 0; }
    to { background-position: 0 190px, 14px 320px, 7px 250px, 0 0; } }
  /* 지구: 코드 글자로 그린 도는 지구. 단계가 오를수록 색·명암·매끄러움이 더해진다 */
  #globe { position: fixed; inset: 0; margin: 0; z-index: 1; pointer-events: none; overflow: hidden;
    font: 13px/1.5 ui-monospace, "Cascadia Code", Consolas, monospace; white-space: pre; font-variant-ligatures: none;
    color: #b0b4ba; opacity: 0; transform: scale(0.94); transition: opacity 0.6s, transform 0.8s cubic-bezier(.2,.8,.3,1); }
  #globe i { font-style: normal; }
  :is(#globe, #flock) .g { color: #5f6368; font-weight: 700; }
  :root.dark #globe { color: #5f6368; }
  :root.dark :is(#globe, #flock) .g { color: #c4c7cc; }
  :is(#globe, #flock) .s { color: color-mix(in srgb, #2f6fd0 45%, transparent); }
  :is(#globe, #flock) .l { color: #1f8a43; font-weight: 700; }
  :root.dark :is(#globe, #flock) .s { color: color-mix(in srgb, #5b8def 60%, transparent); }
  :root.dark :is(#globe, #flock) .l { color: #57d17a; }
  :is(#globe, #flock) .l0 { color: #8be29c; font-weight: 700; } :is(#globe, #flock) .l1 { color: #3fb860; font-weight: 700; }
  :is(#globe, #flock) .l2 { color: #1f8a43; font-weight: 700; } :is(#globe, #flock) .l3 { color: #134f2a; font-weight: 700; }
  :is(#globe, #flock) .s0 { color: #9fd0ff; } :is(#globe, #flock) .s1 { color: #4f9df5; } :is(#globe, #flock) .s2 { color: #2f6fd0; } :is(#globe, #flock) .s3 { color: #1c3f7a; }
  :is(#globe, #flock) .ic { color: #e9f3ff; font-weight: 700; text-shadow: 0 0 2px #7fb2ff; }
  :root.earth-on #globe { opacity: 1; transform: none; }
  /* 지구가 되기 전: 코드 글자가 하나하나 떨어져 나와 지구 원 모양 자리로 모인다 */
  :root.earth #code { opacity: 0; }
  #flock { position: fixed; inset: 0; z-index: 1; pointer-events: none; transition: opacity 0.4s;
    font: 13px/1.5 ui-monospace, "Cascadia Code", Consolas, monospace; color: var(--code); }
  #flock span { position: absolute; transition: color 1.4s, font-weight 1.4s; }   /* 날아가는 동안 도착할 칸의 지구 색으로 물든다 */
  #flock .w { color: #b0b4ba; }
  :root.dark #flock .w { color: #5f6368; }
  :root.earth #screen { opacity: 0.2; }
  .unpop { animation: unpop 0.6s cubic-bezier(.2,.8,.3,1) both; }
  @keyframes unpop { from { transform: scale(0.6); filter: blur(6px); opacity: 0; } }
  @keyframes quake { 20% { transform: translate(-12px, 6px); } 40% { transform: translate(10px, -8px); }
    60% { transform: translate(-6px, -4px); } 80% { transform: translate(4px, 6px); } }
  #corner { position: fixed; top: 16px; right: 24px; z-index: 2; display: flex; gap: 6px; }
  #dark { min-width: 7.5em; text-align: center; }
  #corner [aria-pressed="true"] { font-weight: bold; background: #ffe14d; color: #111; }
  #memo { margin-top: 16px; font-size: 16px; padding: 6px; }
  .hit { background: #ffe14d; color: #111; transition: background 0.3s; }
</style>
</head>
<body class="intro">
<div id="corner">
  <button type="button" id="en">EN</button>
  <button type="button" id="hj">漢字</button>
  <button type="button" id="dark">블랙 모드</button>
</div>
<main id="screen">
  <h1>투명창</h1>
  <p>이 페이지는 자기 자신의 코드를 겹쳐 보여줍니다. (더미 내용)</p>
  <div id="tools">
    <button type="button" id="shake">코드 뒤섞기 (막 눌러 보세요)</button>
    <button type="button" id="bigger">렌즈 크게</button>
    <button type="button" id="smaller">렌즈 작게</button>
    <button type="button" id="retype">타자 다시 보기</button>
    <button type="button" id="quality">퀄리티 업 · 기본 0/3</button>
  </div>
  <input id="memo" type="text" placeholder="여기에 글자를 적어 보세요" size="30">
  <ul>
    <li>목록 하나</li>
    <li>목록 둘</li>
  </ul>
</main>

<pre id="code" aria-hidden="true"></pre>
<pre id="globe" aria-hidden="true"></pre>

<div id="bar">
  <span>창</span>
  <button type="button" id="down">◀ 불투명</button>
  <span id="dots" aria-live="polite"></span>
  <button type="button" id="up">투명 ▶</button>
</div>

<script>
  const screenEl = document.getElementById('screen');
  const codeEl = document.getElementById('code');
  const dots = document.getElementById('dots');

  // 화면 글자는 항상 진하게(앞). 좌우 버튼으로 뒤에 깔린 코드의 진하기를 5단계로 바꾼다.
  let level = 2;                        // 0 = 코드 안 보임 … 4 = 코드 또렷
  let shaking = false;                  // 뒤섞는 동안은 코드를 다 보이게
  let typing = false;                   // 타자 치는 동안도 코드를 다 보이게
  let raining = false;                  // 비가 내리는 동안도 코드를 다 보이게
  function apply() {
    codeEl.style.setProperty('--base', shaking || typing || raining ? 1 : level / 4);
    document.documentElement.style.setProperty('--glass', shaking || typing ? 0 : 1 - level / 4);
    const shown = typing ? 4 : level;  // 타자 중에는 끝까지 투명(코드 다 보임)으로 표시
    dots.textContent = '●'.repeat(shown + 1) + '○'.repeat(4 - shown);   // 지금 단계 표시
    dots.setAttribute('aria-label', `창 투명도 ${shown + 1}/5단계`);
  }
  document.getElementById('down').addEventListener('click', () => { level = Math.max(0, level - 1); apply(); });
  document.getElementById('up').addEventListener('click', () => { level = Math.min(4, level + 1); apply(); });
  apply();

  // 투시 렌즈: 마우스(손가락)가 있는 곳만 뒤의 코드가 비쳐 보인다
  let lastX = innerWidth / 2, lastY = innerHeight / 2;   // 마지막 마우스 위치 (없으면 화면 가운데)
  addEventListener('pointermove', e => { lastX = e.clientX; lastY = e.clientY; });
  function lens(x, y) {
    codeEl.style.setProperty('--x', x + 'px');
    codeEl.style.setProperty('--y', y + 'px');
  }
  let holdLens = 0;                     // 짝 찾기 직후 렌즈를 잠깐 고정
  addEventListener('pointermove', e => { if (Date.now() > holdLens) lens(e.clientX, e.clientY); });
  document.documentElement.addEventListener('pointerleave', () => lens(-9999, -9999));

  // 코드를 줄 단위로 넣는다 (짝 찾기에서 줄을 집어내려고)
  let lines = [];
  let orig = [];                        // 지금 보여 줄 줄 (뒤섞여도 이걸로 되돌린다)
  let pristine = [];                    // 처음 받은 그대로 (한글 원본)
  function showCode(src) {
    codeEl.textContent = '';
    codeEl.append(ring);
    orig = src.split('\n');
    pristine = orig.slice();
    memoIdx = orig.findIndex(t => t.trim().startsWith('<input id="memo"'));
    memoBase = memoIdx >= 0 ? orig[memoIdx] : '';
    lines = orig.map(text => {
      const span = document.createElement('span');
      span.className = 'ln';
      codeEl.appendChild(span);
      return span;
    });
    eggIdx = orig.findIndex(t => t.includes('/* 버튼 */'));
    typeOut();
  }

  // 코드 색 구분: 주석·문자열·태그·예약어·숫자를 조각내 표시 (색은 2단계부터 보인다)
  const TOK = /(\/\/.*$|\/\*.*?\*\/|<!--.*?-->)|('(?:[^'\\]|\\.)*'|"(?:[^"\\]|\\.)*"|`(?:[^`\\]|\\.)*`)|(<\/?[a-zA-Z][\w-]*|\/?>)|\b(const|let|function|return|if|else|for|new|true|false|null|of|in)\b|(#[0-9a-fA-F]{3,6}\b|\b\d+(?:\.\d+)?(?:px|s|%|deg|vw|vh|em|ch)?)/g;
  const KIND = ['c', 's', 't', 'k', 'n'];
  function paint(text) {
    const frag = document.createDocumentFragment();

      const span = document.createElement('span');
      span.className = 't-' + KIND[m.slice(1).findIndex(g => g !== undefined)];
      span.textContent = m[0];
      frag.append(span);
      last = m.index + m[0].length;

    frag.append(text.slice(last));
    return frag;
  }

  // 코드 줄 하나를 원본대로 쓴다. 이스터에그 줄이면 '버튼' 글자만 누를 수 있게 꾸민다
  let eggIdx = -1;
  function setLine(i) {
    const line = lines[i], text = orig[i];
    if (i !== eggIdx) { line.textContent = ''; line.append(paint(text), '\n'); return; }
    const word = EGG[lang], at = text.lastIndexOf(word);
    if (at < 0) { line.textContent = text + '\n'; return; }
    line.textContent = '';
    const egg = document.createElement('span');
    egg.className = 'egg'; egg.textContent = word;
    egg.addEventListener('click', hatch);
    line.append(text.slice(0, at), egg, text.slice(at + word.length) + '\n');
  }

  // 이스터에그: 코드 속 '버튼'을 누르면 글상자에 살짝 적힌다
  function hatch(e) {
    e.stopPropagation();

    memo.dispatchEvent(new Event('input'));   // 뒤 코드에도 그대로 써진다
  }

  // 타자 효과: 코드가 누가 치는 것처럼 한 글자씩 쓰여 나간다

  const firstLine = new WeakMap();      // 처음(한글) 모양의 첫 줄을 기억
  screenEl.querySelectorAll('*').forEach(el => firstLine.set(el, el.outerHTML.split('\n')[0].trim()));

    if (e.target.id === 'shake') return;  // 뒤섞기는 짝 찾기 대신 뒤섞기만
    finishTyping();
    const el = e.target.closest('#screen button, #screen li, #screen > *');
    if (!el) return;
    const first = firstLine.get(el) || el.outerHTML.split('\n')[0].trim();

    const start = pristine.findIndex(t => t.includes('<main id="screen">'));

    const idx = pristine.findIndex((t, i) => i > start && i < end && t.trim().startsWith(first));
    const found = el.id === 'memo' ? memoIdx : idx;   // 입력칸 줄은 글자가 들어가 모양이 바뀌므로 따로 기억
    if (found < 0) return;
    flash(found);
  });

    const v = memo.value.trim().toLowerCase();
    const hit = findSecret();

  }

    const v = memo.value.replace(/&/g, '&amp;').replace(/"/g, '&quot;');

  function smash() {

    for (let k = 0; k < n; k++) {

      lines[i].textContent = orig[i].replace(/\S/g, c =>
        Math.random() < 0.3 + power / 35 ? GLYPHS[Math.floor(Math.random() * GLYPHS.length)] : c) + '\n';
      broken.add(i);
    }

  }
  function rain() {
    if (raining) return;
    finishTyping();
    raining = true; apply();
    if (quality >= 3) {                 // 3단계: 흑백으로 바랜 뒤 제자리에서 파란 비
      codeEl.classList.add('gray');
      setTimeout(() => codeEl.classList.add('blue'), 600);
      setTimeout(() => codeEl.classList.remove('blue'), 4400);
      setTimeout(() => { codeEl.classList.remove('gray'); raining = false; apply(); }, 4600);

    });

  }
  // 지구: 대륙 지도 (위도 10도 띠마다 육지 경도 구간, 북 85° → 남 -85°)
  const LAND = [
    [[-95, -70], [-60, -25]],
    [[-120, -70], [-55, -20], [15, 25], [55, 60], [90, 110]],
    [[-165, -95], [-78, -60], [-50, -35], [-24, -14], [10, 180]],
    [[-130, -92], [-78, -60], [-6, 2], [5, 140], [155, 163]],
    [[-124, -60], [-2, 142]],
    [[-120, -77], [-9, -2], [9, 11], [22, 120], [126, 129], [130, 140]],
    [[-110, -97], [-82, -80], [-15, 35], [36, 122]],
    [[-97, -83], [-17, 40], [43, 52], [74, 80], [95, 109], [120, 125]],
    [[-77, -60], [-10, 48], [100, 104], [110, 118], [122, 126]],
    [[-80, -35], [12, 40], [105, 115], [120, 123], [133, 150]],
    [[-76, -39], [12, 40], [44, 50], [125, 145]],
    [[-70, -45], [15, 33], [44, 47], [114, 153]],
    [[-72, -57], [18, 25], [116, 150], [173, 175]],
    [[-74, -65], [145, 148], [167, 172]],

    [[-65, -55]],
    [[-180, -60], [-30, 165]],

  const FPS_GAP = [250, 100, 40, 0];    // 단계별 그리기 간격(ms): 0단계 초당 4장 … 3단계 매 프레임
  const LIGHT = [-0.45, 0.55, 0.7];     // 빛이 오는 방향 (왼쪽 위 앞)
  function earth() {

    cancelAnimationFrame(earthFrame); clearTimeout(earthTimer);

    const cw = probe.getBoundingClientRect().width / 10, ch = parseFloat(getComputedStyle(globeEl).lineHeight);

    const big = stream.repeat(Math.ceil(W * H / stream.length) + 1);

    const src = [];

      let x = rect.left + offset;

  const textOf = el => el.id === 'memo' ? el.placeholder : el.textContent;

  }
  function restore() {

        broken.delete(i);
      }
      if (!todo.length) { clearInterval(restoring); power = 0; shaking = false; apply(); mend(); }
    }, 30);
  }

  // 렌즈 크기
  let radius = 140;
  const ring = document.createElement('div');   // 3단계에서 보이는 렌즈 테두리
  ring.id = 'ring';
  function setRadius(r) { radius = Math.max(60, Math.min(400, r)); codeEl.style.setProperty('--r', radius + 'px'); }
  document.getElementById('bigger').addEventListener('click', () => setRadius(radius + 60));
  document.getElementById('smaller').addEventListener('click', () => setRadius(radius - 60));

  // 영문 / 한자: 앞 화면 글자를 바꾸고, 뒤 코드의 그 줄도 같이 바꾼다. 같은 버튼을 다시 누르면 한글로
  let lang = 'ko';
  const DARK_LABEL = { ko: ['블랙 모드', '화이트 모드'], en: ['Dark mode', 'Light mode'], hj: ['黑色模式', '白色模式'] };
  const WORDS = [
    { sel: 'h1', ko: '투명창', en: 'Glass Window', hj: '透明窓' },
    { sel: '#screen p', ko: '이 페이지는 자기 자신의 코드를 겹쳐 보여줍니다. (더미 내용)',
      en: 'This page shows its own code layered behind it. (dummy text)',
      hj: '此頁示其自身之碼，重疊於後。（假內容）' },
    { sel: '#shake', ko: '코드 뒤섞기 (막 눌러 보세요)', en: 'Scramble code (mash it!)', hj: '攪亂代碼（請連擊）' },
    { sel: '#bigger', ko: '렌즈 크게', en: 'Bigger lens', hj: '放大透鏡' },
    { sel: '#smaller', ko: '렌즈 작게', en: 'Smaller lens', hj: '縮小透鏡' },
    { sel: '#retype', ko: '타자 다시 보기', en: 'Replay typing', hj: '重看打字' },
    { sel: '#memo', attr: 'placeholder', ko: '여기에 글자를 적어 보세요', en: 'Type something here', hj: '請於此處書寫文字' },
    { sel: '#screen li:nth-child(1)', ko: '목록 하나', en: 'Item one', hj: '目錄一' },
    { sel: '#screen li:nth-child(2)', ko: '목록 둘', en: 'Item two', hj: '目錄二' },
    { sel: '#bar > span:first-child', ko: '창', en: 'Window', hj: '窓' },
    { sel: '#down', ko: '◀ 불투명', en: '◀ Opaque', hj: '◀ 不透明' },
    { sel: '#up', ko: '투명 ▶', en: 'Clear ▶', hj: '透明 ▶' },
  ];
  const EGG = { ko: '버튼', en: 'button', hj: '按鈕' };   // 코드 속 숨은 글자
  const EGG_TEXT = { ko: '이스터에그', en: 'Easter egg', hj: '彩蛋' };   // 누르면 글상자에 적히는 말
  // 코드 줄 번역표: lang.json { "한글 줄": { en, hj } } — 없는 줄은 한글 그대로
  let LINES = {};
  fetch('lang.json').then(r => r.json()).then(j => { LINES = j; }).catch(() => {});
  function tr(line, l) {
    const t = l !== 'ko' && LINES[line.trim()]?.[l];
    return t ? line.slice(0, line.length - line.trimStart().length) + t : line;
  }
  function setLang(next) {
    finishTyping();
    WORDS.forEach(w => {
      const el = document.querySelector(w.sel);
      if (w.attr) el.setAttribute(w.attr, w[next]); else el.textContent = w[next];
    });
    lang = next;
    // 뒤 코드도 줄마다 그 언어로 (입력칸 줄은 적은 글자를 다시 붙인다)
    orig = pristine.map(t => tr(t, lang));
    lines.forEach((s, i) => setLine(i));
    if (memoIdx >= 0) { memoBase = orig[memoIdx]; writeMemoLine(); }
    document.documentElement.lang = next === 'en' ? 'en' : 'ko';
    document.getElementById('en').setAttribute('aria-pressed', lang === 'en');
    document.getElementById('hj').setAttribute('aria-pressed', lang === 'hj');
    setDark(document.documentElement.classList.contains('dark'));   // 블랙 모드 버튼 이름도 바꾼다
    setQuality(quality);
  }
  document.getElementById('en').addEventListener('click', () => setLang(lang === 'en' ? 'ko' : 'en'));
  document.getElementById('hj').addEventListener('click', () => setLang(lang === 'hj' ? 'ko' : 'hj'));

  // 퀄리티 업: 누를 때마다 디자인이 한 단계씩 좋아진다 (최대 3단계, 그다음 누르면 처음으로)
  const QUALITY_LABEL = { ko: '퀄리티 업', en: 'Quality up', hj: '品質提升' };
  const STAGE = { ko: ['기본', '정돈', '디자인', '완성'], en: ['Basic', 'Tidy', 'Designed', 'Polished'], hj: ['基本', '整頓', '設計', '完成'] };
  let quality = 0;
  function setQuality(q) {
    quality = q;
    const root = document.documentElement;
    [1, 2, 3].forEach(n => root.classList.toggle('q' + n, q >= n));   // 단계는 쌓인다
    document.getElementById('quality').textContent = `${QUALITY_LABEL[lang]} · ${STAGE[lang][q]} ${q}/3`;
  }
  document.getElementById('quality').addEventListener('click', () => {
    const next = (quality + 1) % 4;
    if (next === 0) {                   // 처음으로 돌아갈 때는 부드럽게 겹쳐 바꾼다
      if (document.startViewTransition) document.startViewTransition(() => setQuality(0));
      else setQuality(0);
      return;
    }
    setQuality(next);
    // 오를 때는 화면 요소들이 차례로 떠오른다
    const items = [...screenEl.children, document.getElementById('bar')];
    items.forEach((el, k) => {
      el.classList.remove('rise'); void el.offsetWidth;
      el.style.animationDelay = (k * 0.06) + 's';
      el.classList.add('rise');
    });
    setTimeout(() => items.forEach(el => el.classList.remove('rise')), 1200);
  });

  // 블랙 모드: 누를 때마다 켜고 끈다, 고른 것은 이 브라우저에 기억
  const darkBtn = document.getElementById('dark');
  function setDark(on) {
    document.documentElement.classList.toggle('dark', on);
    darkBtn.textContent = DARK_LABEL[lang][on ? 1 : 0];
    try { localStorage.setItem('dark', on ? '1' : '0'); } catch (e) {}
  }
  darkBtn.addEventListener('click', () => {
    const next = !document.documentElement.classList.contains('dark');
    if (document.startViewTransition) document.startViewTransition(() => setDark(next));
    else setDark(next);                 // 지원 안 하는 브라우저는 바로 바꾼다
  });
  try { if (localStorage.getItem('dark') === '1') setDark(true); } catch (e) {}

  // 자기 자신의 원본 코드를 가져온다 (file://로 열면 실패 → 현재 DOM으로 대체)
  fetch(location.href)
    .then(r => r.text())
    .then(showCode)
    .catch(() => showCode('<!doctype html>\n' + document.documentElement.outerHTML));
</script>
</body>
</html>
