<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>투명창</title>
<link rel="icon" href="data:,">
<style>
  body { margin: 0; font-family: sans-serif; }
  #screen { position: relative; z-index: 1; padding: 24px; padding-bottom: 80px; }
  #code {
    position: fixed; inset: 0 0 56px 0; margin: 0; padding: 24px;
    overflow: auto; font: 13px/1.5 monospace; white-space: pre-wrap;
    pointer-events: none; z-index: 0; color: #111;
    /* 투시 렌즈: 마우스 둘레는 코드가 또렷, 나머지는 슬라이더 값만큼 */
    --x: -9999px; --y: -9999px; --base: 0.5;
    -webkit-mask-image: radial-gradient(circle 140px at var(--x) var(--y), #000 60%, rgba(0,0,0,var(--base)) 100%);
            mask-image: radial-gradient(circle 140px at var(--x) var(--y), #000 60%, rgba(0,0,0,var(--base)) 100%);
  }
  #bar {
    position: fixed; left: 0; right: 0; bottom: 0; height: 56px;
    display: flex; align-items: center; gap: 12px; padding: 0 16px;
    border-top: 1px solid #ccc; background: #fff;
  }
  #bar input { flex: 1; }
  #screen > *, #screen li { cursor: pointer; }
  .hit { background: #ffe14d; transition: background 0.3s; }
</style>
</head>
<body>
<main id="screen">
  <h1>투명창</h1>
  <p>이 페이지는 자기 자신의 코드를 겹쳐 보여줍니다. (더미 내용)</p>
  <button type="button">버튼 예시</button>
  <ul>
    <li>목록 하나</li>
    <li>목록 둘</li>
  </ul>
</main>

<pre id="code" aria-hidden="true"></pre>

<div id="bar">
  <span>화면</span>
  <input id="mix" type="range" min="0" max="100" value="50" aria-label="화면과 코드 비율">
  <span>코드</span>
</div>

<script>
  const screenEl = document.getElementById('screen');
  const codeEl = document.getElementById('code');
  const mix = document.getElementById('mix');

  // 화면 글자는 항상 진하게(앞). 슬라이더는 뒤에 깔린 코드만 점점 보이게 한다.
  function apply() {
    const t = mix.value / 100;          // 0 = 코드 안 보임, 1 = 코드 또렷
    codeEl.style.setProperty('--base', t);
  }
  mix.addEventListener('input', apply);
  apply();

  // 투시 렌즈: 마우스(손가락)가 있는 곳만 뒤의 코드가 비쳐 보인다
  function lens(x, y) {
    codeEl.style.setProperty('--x', x + 'px');
    codeEl.style.setProperty('--y', y + 'px');
  }
  let holdLens = 0;                     // 짝 찾기 직후 렌즈를 잠깐 고정
  addEventListener('pointermove', e => { if (Date.now() > holdLens) lens(e.clientX, e.clientY); });
  document.documentElement.addEventListener('pointerleave', () => lens(-9999, -9999));

  // 코드를 줄 단위로 넣는다 (짝 찾기에서 줄을 집어내려고)
  let lines = [];
  function showCode(src) {
    codeEl.textContent = '';
    lines = src.split('\n').map(text => {
      const span = document.createElement('span');
      span.textContent = text + '\n';
      codeEl.appendChild(span);
      return span;
    });
  }

  // 짝 찾기: 화면 요소를 누르면 그 요소를 만든 코드 줄이 반짝인다
  screenEl.addEventListener('click', e => {
    const el = e.target.closest('#screen > *, #screen li');
    if (!el) return;
    const first = el.outerHTML.split('\n')[0].trim();
    // 화면(main) 부분의 줄에서만 찾는다 — 스크립트 속 같은 글자는 제외
    const start = lines.findIndex(s => s.textContent.includes('<main id="screen">'));
    const end = lines.findIndex((s, i) => i > start && s.textContent.includes('</main>'));
    const line = lines.slice(start, end).find(s => s.textContent.trim().startsWith(first));
    if (!line) return;

    lines.forEach(s => s.classList.remove('hit'));
    line.classList.add('hit');
    line.scrollIntoView({ block: 'center' });
    const r = line.getBoundingClientRect();
    lens(r.left + 120, r.top + r.height / 2); // 렌즈를 그 줄로 옮긴다
    holdLens = Date.now() + 1500;
    setTimeout(() => line.classList.remove('hit'), 1500);
  });

  // 자기 자신의 원본 코드를 가져온다 (file://로 열면 실패 → 현재 DOM으로 대체)
  fetch(location.href)
    .then(r => r.text())
    .then(showCode)
    .catch(() => showCode('<!doctype html>\n' + document.documentElement.outerHTML));
</script>
</body>
</html>
